<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little Fawn Word Explorer — เกมทายคำศัพท์ภาษาอังกฤษ ป.1–ป.2 (จันทร์–ศุกร์)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Itim&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#4a3b52;
  --paper:#fff8e7;
  --pink:#ffb3c7;
  --mint:#a8e6cf;
  --lemon:#fff1a8;
  --lav:#cdb4ff;
  --sky:#a8d8ff;
  --peach:#ffcba4;
  --orange:#ff9f43;
  --red:#ff6b81;
  --sh:4px 4px 0 rgba(74,59,82,.22);
}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family:'Mali','Itim','Noto Sans Thai',system-ui,sans-serif;
  color:var(--ink);
  line-height:1.45;
  overflow-x:hidden;
  background:
    radial-gradient(circle at 8% 10%,#ffd6e8 0 90px,transparent 91px),
    radial-gradient(circle at 92% 18%,#c9f0e0 0 110px,transparent 111px),
    radial-gradient(circle at 80% 90%,#e3d7ff 0 130px,transparent 131px),
    radial-gradient(circle at 10% 85%,#fff1a8 0 100px,transparent 101px),
    var(--paper);
  background-attachment:fixed;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.28;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .35 0 0 0 0 .35 0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-family:'Itim','Mali',sans-serif}

#app{position:relative;z-index:2;max-width:1040px;margin:0 auto;padding:12px 14px 40px}

/* Header */
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:4px 2px 10px}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{font-size:2.3rem;animation:float 3s ease-in-out infinite}
.brand h1{font-size:1.55rem;line-height:1.1}
.brand p{margin:0;font-size:.85rem;opacity:.82}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Buttons & Badges */
.btn{
  display:inline-flex;align-items:center;gap:7px;justify-content:center;
  font-weight:700;border:3px solid var(--ink);
  border-radius:16px 20px 14px 22px/20px 14px 22px 16px;
  padding:.5em 1.05em;background:#fff;box-shadow:var(--sh);
  cursor:pointer;transition:transform .14s, background .14s;text-align:center;user-select:none;
}
.btn:hover:not(:disabled){transform:translateY(-2px) rotate(-.8deg)}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:none}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}
.btn.small{padding:.28em .78em;font-size:.88rem}
.btn.lg{padding:.72em 1.35em;font-size:1.12rem}
.btn.xl{padding:.85em 1.55em;font-size:1.22rem}
.btn.orange{background:var(--orange)}
.btn.mint{background:var(--mint)}
.btn.lav{background:var(--lav)}
.btn.sky{background:var(--sky)}
.btn.pink{background:var(--pink)}
.btn.lemon{background:var(--lemon)}
.btn.danger{background:var(--red);color:#fff}

.badge{
  display:inline-flex;align-items:center;gap:5px;
  border:2.5px solid var(--ink);border-radius:999px;
  padding:2px 12px;font-size:.85rem;font-weight:700;background:var(--lemon);
}
.badge.mint{background:var(--mint)}
.badge.sky{background:var(--sky)}
.badge.pink{background:var(--pink)}
.badge.lav{background:var(--lav)}

.crayon{
  border:3px solid var(--ink);
  border-radius:24px 30px 22px 28px/28px 22px 30px 24px;
  box-shadow:var(--sh);
  background:#fffdf7;
}

/* Rest screen (Weekend / Sunday) */
.lock-box{
  padding:28px 20px;text-align:center;
  background:linear-gradient(155deg,#fff,#fff5d6 60%,#ffe4ec);
}
.lock-icon{font-size:4.2rem;display:inline-block;animation:float 2.8s ease-in-out infinite}
.lock-title{font-size:1.85rem;margin:8px 0 6px}
.countdown-pill{
  display:inline-block;margin:10px 0;padding:10px 22px;
  background:var(--lemon);border:3px solid var(--ink);border-radius:999px;
  font-size:1.12rem;font-weight:700;box-shadow:var(--sh);
}

/* Main Stage - 80% Visual Card */
.stage-wrap{
  display:flex;flex-direction:column;gap:12px;
}
.stage-top{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;
  padding:8px 14px;background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:var(--sh);
}
.dots{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dot{
  width:28px;height:28px;border-radius:50%;border:2.5px solid var(--ink);
  display:grid;place-items:center;font-size:.82rem;font-weight:700;
  background:#fff;cursor:pointer;transition:transform .15s;
}
.dot.cur{background:var(--orange);transform:scale(1.14)}
.dot.known{background:var(--mint)}
.dot.review{background:var(--pink)}

.hero-card{
  position:relative;
  background:linear-gradient(165deg,#ffffff 0%,#fffdf5 65%,#f5fbff 100%);
  padding:14px 16px 18px;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  min-height:calc(100vh - 235px);
  min-height:calc(100dvh - 235px);
  animation:pop .28s both;
}
.hero-meta{
  width:100%;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;
}

/* 80% Animated Illustration Stage */
.anim-stage{
  width:100%;
  flex:1 1 auto;
  min-height:290px;
  height:56vh;
  max-height:520px;
  margin:8px 0;
  border:3px dashed rgba(74,59,82,.28);
  border-radius:22px;
  background:radial-gradient(circle at 50% 45%,#ffffff 0%,#fff9eb 72%,#f0f8ff 100%);
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
  cursor:pointer;
}
.anim-stage svg{
  width:82%;
  height:82%;
  max-width:440px;
  max-height:440px;
  overflow:visible;
}
.tap-hint{
  position:absolute;bottom:8px;right:12px;
  font-size:.78rem;opacity:.68;background:rgba(255,255,255,.85);
  padding:2px 10px;border-radius:999px;border:1.5px solid rgba(74,59,82,.25);
}

/* Word + Reading + Meaning block */
.word-panel{
  width:100%;text-align:center;
  background:rgba(255,255,255,.92);
  border:3px solid var(--ink);
  border-radius:20px;
  padding:10px 14px;
  box-shadow:3px 3px 0 rgba(74,59,82,.16);
}
.word-main-row{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;
}
.word-text{
  font-family:'Itim','Mali',sans-serif;
  font-size:clamp(2.2rem,6.5vw,3.5rem);
  font-weight:700;
  line-height:1.12;
  color:var(--ink);
}
.word-reading{
  font-size:clamp(1.15rem,3vw,1.45rem);
  font-weight:700;
  color:#7a5c8a;
  margin-top:2px;
}
.word-meaning{
  font-size:clamp(1.05rem,2.6vw,1.3rem);
  color:#2f6f56;
  font-weight:600;
  margin-top:2px;
}

/* Bottom Controls */
.ctrl-bar{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:4px;
}
.ctrl-nav{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;
}
.ctrl-judge{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end;
}

/* Summary Screen */
.sum-card{
  padding:24px 18px;text-align:center;
  background:linear-gradient(155deg,#fff,#e8fbf2 55%,#fff5cc);
}
.sum-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
  gap:10px;margin:16px 0;text-align:left;
}
.mini-card{
  border:2.5px solid var(--ink);border-radius:16px;padding:10px 12px;
  background:#fff;display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.mini-card.known{background:#e7fbf0}
.mini-card.review{background:#ffe8ef}

/* 26-Week Mon-Fri Schedule Grid */
.week-list{
  display:flex;flex-direction:column;gap:12px;margin-top:14px;
}
.wk-row{
  border:2.5px solid var(--ink);border-radius:18px;padding:10px 12px;
  background:#fff;
}
.wk-row-head{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;
  margin-bottom:8px;
}
.wk-days{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;
}
.day-pill{
  border:2px solid var(--ink);border-radius:14px;padding:8px 10px;
  background:#fffdf7;display:flex;flex-direction:column;gap:3px;
  transition:transform .14s;
}
.day-pill.done{background:var(--mint)}
.day-pill.today{background:var(--lemon);outline:3px dashed var(--orange);outline-offset:1px}
.day-pill.locked{opacity:.65;background:#f5f1e8}
.day-pill.clickable{cursor:pointer}
.day-pill.clickable:hover{transform:translateY(-2px)}

/* Animations */
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px) rotate(3deg)}}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
@keyframes wobble{0%,100%{transform:rotate(0deg)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
@keyframes bounceSoft{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-14px) scale(1.04)}}
@keyframes pulseSoft{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
@keyframes spinSlow{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes flyAcross{0%,100%{transform:translate(0,0) rotate(-3deg)}50%{transform:translate(16px,-14px) rotate(4deg)}}
@keyframes swimWave{0%,100%{transform:translateX(-12px) rotate(-2deg)}50%{transform:translateX(12px) rotate(2deg)}}
@keyframes flapLeft{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.35)}}
@keyframes flapRight{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.35)}}
@keyframes rainDrop{0%{transform:translateY(-10px);opacity:0}40%{opacity:1}100%{transform:translateY(28px);opacity:0}}
@keyframes twinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.82)}}
@keyframes driveMove{0%,100%{transform:translateX(-14px)}50%{transform:translateX(14px)}}

.anim-float{animation:float 2.6s ease-in-out infinite;transform-origin:center}
.anim-wobble{animation:wobble 2.2s ease-in-out infinite;transform-origin:center}
.anim-bounce{animation:bounceSoft 1.8s ease-in-out infinite;transform-origin:center}
.anim-pulse{animation:pulseSoft 1.9s ease-in-out infinite;transform-origin:center}
.anim-spin{animation:spinSlow 9s linear infinite;transform-origin:center}
.anim-fly{animation:flyAcross 2.5s ease-in-out infinite;transform-origin:center}
.anim-swim{animation:swimWave 2.6s ease-in-out infinite;transform-origin:center}
.anim-drive{animation:driveMove 2.4s ease-in-out infinite;transform-origin:center}
.anim-twinkle{animation:twinkle 1.6s ease-in-out infinite;transform-origin:center}
.anim-rain1{animation:rainDrop 1.3s linear infinite}
.anim-rain2{animation:rainDrop 1.3s linear .45s infinite}
.anim-rain3{animation:rainDrop 1.3s linear .9s infinite}
.wing-l{animation:flapLeft .55s ease-in-out infinite;transform-origin:100px 100px}
.wing-r{animation:flapRight .55s ease-in-out infinite;transform-origin:100px 100px}

#toasts{position:fixed;left:0;right:0;bottom:16px;z-index:99;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 12px}
.toast{background:var(--ink);color:#fff;border-radius:16px;padding:8px 18px;font-weight:600;animation:pop .22s both;box-shadow:var(--sh)}

@media (max-width:740px){
  .hero-card{min-height:auto}
  .anim-stage{height:44vh;min-height:240px}
  .ctrl-bar{grid-template-columns:1fr}
  .ctrl-nav,.ctrl-judge{justify-content:center}
  .ctrl-nav .btn,.ctrl-judge .btn{flex:1 1 auto}
  .wk-days{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01s!important;transition:none!important}
}
</style>
</head>

<div id="app">
  <header class="top">
    <div class="brand">
      <span class="logo">🦌</span>
      <div>
        <h1>Little Fawn Word Explorer</h1>
        <p>คำศัพท์ภาษาอังกฤษ ป.1–ป.2 • เล่นวันจันทร์–ศุกร์ หยุดเฉพาะวันอาทิตย์ (ชุดละ 8 คำ • 6 เดือน)</p>
      </div>
    </div>
    <div class="actions">
      <button class="btn small sky" id="btnViewCal">📅 ตารางเรียน จันทร์–ศุกร์ (6 เดือน)</button>
      <button class="btn small lav" id="btnParentMode">🔒 โหมดทดลองเล่น: ปิด</button>
    </div>
  </header>

  <main id="main"></main>
</div>
<div id="toasts"></div>

const TH_DAYS_SHORT = ['อา','จ','อ','พ','พฤ','ศ','ส'];
const TH_MON = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

function parseISO(iso){
  const [y,m,d] = iso.split('-').map(Number);
  return new Date(y, m-1, d, 12);
}
function fmtDateTH(iso){
  const [y,m,d] = iso.split('-').map(Number);
  return `${d} ${TH_MON[m-1]} ${y+543}`;
}
function dayNameTH(iso){
  return TH_DAYS_FULL[parseISO(iso).getDay()];
}
function dayShortTH(iso){
  return TH_DAYS_SHORT[parseISO(iso).getDay()];
}
function todayISO(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function nextPlayDayFrom(iso){
  const found = PLAY_DAYS.find(s => s >= iso);
  return found || PLAY_DAYS[PLAY_DAYS.length - 1];
}
function daysBetween(a, b){
  return Math.round((parseISO(b) - parseISO(a)) / 86400000);
}

  const raw = localStorage.getItem(STORAGE_KEY);
  if(raw) saved = { ...saved, ...JSON.parse(raw) };
}catch(e){}
function persist(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(saved)); }catch(e){}
}

const state = {
  screen: 'play', // 'play' | 'calendar' | 'summary'
  dayIdx: 0,      // 0..129
  words: [],      // 8 English words per day
  idx: 0,
  status: [],     // '' | 'known' | 'review'
  reviewOnly: false
};

function getDayWords(dayIdx){
  // 26 sets x 8 words = 208 words, cycling smoothly across the 130 Mon-Fri days (5 full rounds of 26 sets)
  const setIdx = dayIdx % 26;
  return WORDS_DB.slice(setIdx * 8, setIdx * 8 + 8).map((w, i) => ({
    id: `${dayIdx}-${i}`,
    lang: 'en',
    text: w[1],
    reading: w[2],
    meaning: w[3],
    cat: w[4],
    anim: w[5],
    c1: w[6],
    c2: w[7]
  }));
}

function initDaySession(dIdx, onlyReview = false){
  state.dayIdx = Math.max(0, Math.min(PLAY_DAYS.length - 1, dIdx));
  const baseWords = getDayWords(state.dayIdx);
  if(onlyReview){
    const rev = baseWords.filter((_, i) => state.status[i] === 'review');
    state.words = rev.length ? rev : baseWords;
    state.reviewOnly = rev.length > 0;
  } else {
    state.words = baseWords;
    state.reviewOnly = false;
  }
  state.idx = 0;
  state.status = Array(state.words.length).fill('');
  state.screen = 'play';
}

/* ====== 3. เสียงอ่านคำศัพท์ภาษาอังกฤษ ====== */
function speakWord(w){
  if(!w) return;
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(w.text);
    u.lang = 'en-US';
    u.rate = 0.84;
    u.pitch = 1.05;
    window.speechSynthesis.speak(u);
  }catch(e){
    toast('อุปกรณ์นี้ไม่รองรับเสียงอ่านอัตโนมัติ');
  }
}

function toast(msg){
  const box = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

/* ====== 5. เรนเดอร์หน้าจอ ====== */
function render(){
  const main = document.getElementById('main');
  const btnParent = document.getElementById('btnParentMode');
  btnParent.textContent = saved.parentUnlock ? '🔓 โหมดทดลองเล่น: เปิด' : '🔒 โหมดทดลองเล่น: ปิด';
  btnParent.classList.toggle('lemon', saved.parentUnlock);

  const iso = todayISO();
  const playIdx = PLAY_DAYS.indexOf(iso);
  const isPlayableWeekday = playIdx !== -1;
  const doneCount = Object.keys(saved.completedDays).length;

  // หน้าตาราง 26 สัปดาห์ (จันทร์–ศุกร์ 130 วัน)
  if(state.screen === 'calendar'){
    const weeksHTML = Array.from({length: 26}, (_, wk) => {
      const slice = PLAY_DAYS.slice(wk * 5, wk * 5 + 5);
      const cat = WORDS_DB[(wk % 26) * 8][4];
      return `
        <div class="wk-row">
          <div class="wk-row-head">
            <b>🗓️ สัปดาห์ที่ ${wk + 1} (${fmtDateTH(slice[0])} – ${fmtDateTH(slice[4])})</b>
            <span class="badge sky">หมวดหลัก: ${cat}</span>
          </div>
          <div class="wk-days">
            ${slice.map((d, j) => {
              const dIdx = wk * 5 + j;
              const done = saved.completedDays[dIdx];
              const isToday = d === iso;
              const canOpen = isToday || saved.parentUnlock || !!done;
              const dayCat = WORDS_DB[(dIdx % 26) * 8][4];
              return `
                <div class="day-pill ${done ? 'done' : ''} ${isToday ? 'today' : ''} ${!canOpen ? 'locked' : 'clickable'}" data-open-day="${dIdx}">
                  <div style="display:flex;justify-content:space-between;align-items:center">
                    <b>วัน${dayNameTH(d)}</b>
                    <span>${done ? `✅ ${done.known}/8` : isToday ? '🎯 วันนี้' : canOpen ? '🔓' : '🔒'}</span>
                  </div>
                  <div style="font-size:.86rem">${fmtDateTH(d)}</div>
                  <div style="font-size:.76rem;opacity:.78">${dayCat} (8 คำ)</div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }).join('');

    main.innerHTML = `
      <section class="crayon" style="padding:18px">
        <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between">
          <div>
            <h2>📅 ตารางคำศัพท์วันจันทร์–ศุกร์ (6 เดือน • 26 สัปดาห์)</h2>
            <p style="margin:4px 0 0;font-size:.9rem">เริ่มจันทร์ที่ 23 พ.ย. 2569 ถึง 23 พ.ค. 2570 • เล่นวันจันทร์–ศุกร์ (หยุดเฉพาะวันอาทิตย์ / สุดสัปดาห์) • ผ่านแล้ว <b>${doneCount}/${PLAY_DAYS.length}</b> วัน</p>
          </div>
          <button class="btn orange" id="btnBackToPlay">⬅️ กลับหน้าเล่นเกม</button>
        </div>
        <div class="week-list">${weeksHTML}</div>
      </section>
    `;
    document.getElementById('btnBackToPlay').onclick = () => { state.screen = 'play'; render(); };
    document.querySelectorAll('[data-open-day]').forEach(el => {
      el.onclick = () => {
        const idx = Number(el.dataset.openDay);
        const d = PLAY_DAYS[idx];
        const canOpen = (d === iso) || saved.parentUnlock || !!saved.completedDays[idx];
        if(!canOpen){
          toast('🔒 เล่นได้เฉพาะวันจันทร์–ศุกร์ตามตาราง หรือเปิด "โหมดทดลองเล่น" ด้านบน');
          return;
        }
        initDaySession(idx, false);
        render();
      };
    });
    return;
  }

  // กรณีตรงกับวันหยุด (วันอาทิตย์ / เสาร์ หรือก่อนวันจันทร์ที่ 23 พ.ย. 2569) และไม่ได้เปิดโหมดทดลองเล่น
  if(!isPlayableWeekday && !saved.parentUnlock){
    const nextDay = nextPlayDayFrom(iso);
    const nextIdx = PLAY_DAYS.indexOf(nextDay);
    const diff = daysBetween(iso, nextDay);
    const cat = WORDS_DB[(nextIdx % 26) * 8][4];
    const isSundayNow = parseISO(iso).getDay() === 0;
    main.innerHTML = `
      <section class="crayon lock-box">
        <div class="lock-icon">${isSundayNow ? '🌞' : '🛌'}</div>
        <h2 class="lock-title">${isSundayNow ? 'วันนี้วันอาทิตย์ — วันหยุดพักผ่อนของหนู ๆ จ้า' : 'วันนี้ยังไม่อยู่ในรอบวันจันทร์–ศุกร์นะจ๊ะ'}</h2>
        <p style="font-size:1.05rem;max-width:580px;margin:0 auto">
          ตารางคำศัพท์ภาษาอังกฤษรอบตัวเปิดให้เล่น <b>ทุกวันจันทร์–ศุกร์ (หยุดเฉพาะวันอาทิตย์ / วันหยุดสุดสัปดาห์)</b> เริ่มตั้งแต่วันจันทร์ที่ 23 พ.ย. 2569 เป็นต้นไป
        </p>
        <div class="countdown-pill">
          🗓️ รอบเล่นถัดไป: <b>วัน${dayNameTH(nextDay)}ที่ ${fmtDateTH(nextDay)}</b> (วันที่ ${nextIdx + 1}/${PLAY_DAYS.length} • หมวด${cat})
          ${diff > 0 ? `<br><small>อีก ${diff} วัน จะเปิดชุดคำศัพท์ภาษาอังกฤษ 8 คำอัตโนมัติ</small>` : ''}
        </div>
        <div style="margin-top:14px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center">
          <button class="btn sky" id="btnLockCal">📅 ดูตารางเรียน จันทร์–ศุกร์ (ผ่านแล้ว ${doneCount}/${PLAY_DAYS.length} วัน)</button>
          <button class="btn mint" id="btnUnlockNow">🔓 ผู้ปกครองกดเพื่อทดลองเล่นตอนนี้</button>
        </div>
      </section>
    `;
    document.getElementById('btnLockCal').onclick = () => { state.screen = 'calendar'; render(); };
    document.getElementById('btnUnlockNow').onclick = () => {
      saved.parentUnlock = true;
      persist();
      const targetIdx = playIdx !== -1 ? playIdx : Math.max(0, nextIdx);
      initDaySession(targetIdx, false);
      toast('🔓 เปิดโหมดทดลองเล่นแล้ว');
      render();
    };
    return;
  }

  // หน้าสรุปผลเมื่อเล่นครบ 8 คำ
  if(state.screen === 'summary'){
    const knownN = state.status.filter(s => s === 'known').length;
    const revN = state.status.filter(s => s === 'review').length;
    const dISO = PLAY_DAYS[state.dayIdx];
    const wkNum = Math.floor(state.dayIdx / 5) + 1;
    main.innerHTML = `
      <section class="crayon sum-card">
        <div style="font-size:4rem">🏆</div>
        <h2 style="font-size:1.85rem">เก่งมาก! จบชุดคำศัพท์วัน${dayNameTH(dISO)}ที่ ${fmtDateTH(dISO)} แล้ว</h2>
        <p style="font-size:1.05rem;margin:6px 0">
          สัปดาห์ที่ ${wkNum} (วันที่ ${state.dayIdx + 1}/${PLAY_DAYS.length}) • จำได้แล้ว <b>${knownN}/${state.words.length}</b> คำ • ทบทวนต่อ <b>${revN}</b> คำ
        </p>
        <div class="sum-grid">
          ${state.words.map((w, i) => {
            const st = state.status[i];
            return `
              <div class="mini-card ${st}">
                <div>
                  <div style="font-weight:700;font-size:1.2rem">${w.text} <small style="opacity:.7">(EN)</small></div>
                  <div style="font-size:.88rem;color:#7a5c8a">${w.reading} • ${w.meaning}</div>
                </div>
                <span class="badge ${st === 'known' ? 'mint' : 'pink'}">${st === 'known' ? '✓ จำได้' : '⭐ ทบทวน'}</span>
              </div>
            `;
          }).join('')}
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px">
          <button class="btn lg orange" id="btnRestartAll">↺ ทำใหม่ทั้งหมด (${state.words.length} คำ)</button>
          ${revN > 0 ? `<button class="btn lg pink" id="btnReviewOnly">⭐ ทบทวนเฉพาะคำที่ยังไม่แม่น (${revN} คำ)</button>` : ''}
          <button class="btn lg sky" id="btnGoCal">📅 ดูตารางเรียน 6 เดือน</button>
        </div>
      </section>
    `;
    document.getElementById('btnRestartAll').onclick = () => {
      initDaySession(state.dayIdx, false);
      render();
    };
    const btnRev = document.getElementById('btnReviewOnly');
    if(btnRev){
      btnRev.onclick = () => {
        initDaySession(state.dayIdx, true);
        render();
      };
    }
    document.getElementById('btnGoCal').onclick = () => { state.screen = 'calendar'; render(); };
    return;
  }

  // หน้าจอเล่นหลัก (ภาพเคลื่อนไหวใหญ่ 80% คู่กับคำศัพท์ภาษาอังกฤษและคำอ่าน)
  const w = state.words[state.idx];
  const dISO = PLAY_DAYS[state.dayIdx];
  const wkNum = Math.floor(state.dayIdx / 5) + 1;
  const knownCnt = state.status.filter(s => s === 'known').length;
  const revCnt = state.status.filter(s => s === 'review').length;

  main.innerHTML = `
    <div class="stage-wrap">
      <div class="stage-top">
        <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">
          <span class="badge lemon">🗓️ สัปดาห์ ${wkNum} • วัน${dayNameTH(dISO)}ที่ ${fmtDateTH(dISO)}</span>
          <span class="badge sky">หมวด: ${w.cat}</span>
          ${state.reviewOnly ? '<span class="badge pink">⭐ โหมดทบทวนคำที่ยังไม่แม่น</span>' : ''}
        </div>
        <div class="dots" aria-label="ตัวเลขข้อ">
          ${state.words.map((_, i) => {
            const st = state.status[i];
            return `<button class="dot ${i === state.idx ? 'cur' : ''} ${st}" data-jump="${i}" title="ข้อที่ ${i+1}">${i+1}</button>`;
          }).join('')}
        </div>
        <div style="display:flex;gap:6px;align-items:center">
          <span class="badge mint">✓ จำได้ ${knownCnt}</span>
          <span class="badge pink">⭐ ทบทวน ${revCnt}</span>
        </div>
      </div>

      <article class="crayon hero-card">
        <div class="hero-meta">
          <span class="badge sky">🔤 English Vocabulary</span>
          <b>คำที่ ${state.idx + 1} จาก ${state.words.length}</b>
          <button class="btn small sky" id="btnSpeakTop">🔊 อ่านคำศัพท์</button>
        </div>

        <div class="anim-stage" id="animBox" title="แตะที่ภาพเพื่อฟังเสียงอ่านคำศัพท์">
          ${buildAnimatedSVG(w)}
          <span class="tap-hint">👆 แตะที่ภาพเพื่อฟังเสียงอ่าน</span>
        </div>

        <div class="word-panel">
          <div class="word-main-row">
            <span class="word-text">${w.text}</span>
            <button class="btn sky" id="btnSpeakMain">🔊 ฟังเสียงอ่าน</button>
          </div>
          <div class="word-reading">🗣️ คำอ่าน: ${w.reading}</div>
          <div class="word-meaning">💡 ความหมาย: ${w.meaning}</div>
        </div>
      </article>

      <div class="ctrl-bar">
        <div class="ctrl-nav">
          <button class="btn lg" id="btnPrev" ${state.idx === 0 ? 'disabled' : ''}>⬅️ ย้อนกลับ</button>
          <button class="btn lg" id="btnSkip">➡️ ข้าม</button>
          <button class="btn lg lemon" id="btnRestart">↺ ทำใหม่</button>
        </div>
        <div class="ctrl-judge">
          <button class="btn xl pink" id="btnReview">⭐ ทบทวนต่อ</button>
          <button class="btn xl mint" id="btnKnown">✓ จำได้แล้ว</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById('btnSpeakTop').onclick = () => speakWord(w);
  document.getElementById('btnSpeakMain').onclick = () => speakWord(w);
  document.getElementById('animBox').onclick = () => speakWord(w);

  document.querySelectorAll('[data-jump]').forEach(btn => {
    btn.onclick = () => {
      state.idx = Number(btn.dataset.jump);
      render();
    };
  });

  document.getElementById('btnPrev').onclick = () => {
    if(state.idx > 0){
      state.idx--;
      render();
    }
  };

  document.getElementById('btnSkip').onclick = () => {
    goNextStep();
  };

  document.getElementById('btnRestart').onclick = () => {
    initDaySession(state.dayIdx, state.reviewOnly);
    toast('↺ เริ่มทำใหม่ตั้งแต่คำที่ 1');
    render();
  };

  document.getElementById('btnReview').onclick = () => {
    state.status[state.idx] = 'review';
    goNextStep();
  };

  document.getElementById('btnKnown').onclick = () => {
    state.status[state.idx] = 'known';
    goNextStep();
  };
}

function goNextStep(){
  if(state.idx + 1 < state.words.length){
    state.idx++;
    render();
  } else {
    const knownN = state.status.filter(s => s === 'known').length;
    if(!state.reviewOnly){
      saved.completedDays[state.dayIdx] = {
        date: todayISO(),
        known: knownN,
        total: state.words.length
      };
      persist();
    }
    state.screen = 'summary';
    render();
  }
}

/* ====== 6. ปุ่มบน Header & เริ่มต้นระบบ ====== */
document.getElementById('btnViewCal').onclick = () => {
  state.screen = state.screen === 'calendar' ? 'play' : 'calendar';
  render();
};

document.getElementById('btnParentMode').onclick = () => {
  saved.parentUnlock = !saved.parentUnlock;
  persist();
  toast(saved.parentUnlock ? '🔓 เปิดโหมดทดลองเล่นแล้ว (เลือกเล่นได้ทุกวันในตาราง)' : '🔒 ปิดโหมดทดลองเล่นแล้ว');
  render();
};

(function boot(){
  const iso = todayISO();
  const pIdx = PLAY_DAYS.indexOf(iso);
  if(pIdx !== -1){
    initDaySession(pIdx, false);
  } else {
    const nextDay = nextPlayDayFrom(iso);
    const idx = Math.max(0, PLAY_DAYS.indexOf(nextDay));
    initDaySession(idx, false);
  }
  render();
})();
</script>
</body>
