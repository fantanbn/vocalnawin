<!DOCTYPE html>
<html lang="th">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Itim&display=swap" rel="stylesheet">
<style>
:root{--ink:#4a3b52;--paper:#fff8e7;--pink:#ffb3c7;--mint:#a8e6cf;--lemon:#fff1a8;--lav:#cdb4ff;--sky:#a8d8ff;--peach:#ffcba4;--orange:#ff9f43;--red:#ff6b81;--sh:4px 4px 0 rgba(74,59,82,.22)}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Mali','Itim','Noto Sans Thai',system-ui,sans-serif;color:var(--ink);line-height:1.45;overflow-x:hidden;
 background:radial-gradient(circle at 8% 10%,#ffd6e8 0 90px,transparent 91px),radial-gradient(circle at 92% 18%,#c9f0e0 0 110px,transparent 111px),radial-gradient(circle at 80% 90%,#e3d7ff 0 130px,transparent 131px),radial-gradient(circle at 10% 85%,#fff1a8 0 100px,transparent 101px),var(--paper);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.28;mix-blend-mode:multiply;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .35  0 0 0 0 .35  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
#app{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding:12px 12px 80px}
h1,h2,h3,h4{margin:0;font-family:'Itim','Mali',sans-serif}
h2{font-size:1.35rem;margin-bottom:10px}h2 small{font-size:.8rem;opacity:.7;font-weight:400}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:6px 2px}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{font-size:2.2rem;animation:float 3s ease-in-out infinite}
.brand h1{font-size:1.5rem;line-height:1.1}.brand p{margin:0;font-size:.85rem;opacity:.75}
.actions{display:flex;flex-wrap:wrap;gap:8px}
@keyframes float{50%{transform:translateY(-5px) rotate(4deg)}}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-9px) rotate(-2deg)}30%{transform:translateX(9px) rotate(2deg)}45%{transform:translateX(-7px)}60%{transform:translateX(7px)}75%{transform:translateX(-3px)}}
.shake{animation:shake .7s;box-shadow:0 0 0 4px var(--red),var(--sh)!important}
@keyframes spin{to{transform:rotate(360deg)}}
.btn{display:inline-flex;align-items:center;gap:6px;justify-content:center;font-weight:700;border:3px solid var(--ink);border-radius:16px 20px 14px 22px/20px 14px 22px 16px;padding:.45em .95em;background:#fff;box-shadow:var(--sh);cursor:pointer;transition:transform .15s;text-align:center}
.btn:hover{transform:translateY(-2px) rotate(-1deg)}.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.small{padding:.2em .7em;font-size:.88rem}.btn.orange{background:var(--orange)}.btn.mint{background:var(--mint)}.btn.lav{background:var(--lav)}.btn.sky{background:var(--sky)}.btn.pink{background:var(--pink)}.btn.danger{background:var(--red);color:#fff}.btn.on{background:var(--lemon)}
.ib{border:2px solid var(--ink);background:#fff;border-radius:10px 12px 9px 13px;padding:1px 6px;cursor:pointer;font-size:.95rem}
.ib:hover{background:var(--lemon)}.ib.del:hover{background:var(--pink)}.ib:disabled{opacity:.35;cursor:not-allowed}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tab{border:3px solid var(--ink);background:#fff;border-radius:14px 18px 12px 18px;padding:.3em .8em;cursor:pointer;font-weight:700}
.tab.on{background:var(--lemon);transform:rotate(-1deg);box-shadow:var(--sh)}
.stubar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{display:flex;align-items:center;gap:6px;border:3px solid var(--ink);border-radius:999px;padding:3px 12px 3px 4px;background:#fff;cursor:pointer;font-weight:700}
.chip.on{background:var(--c,var(--mint));box-shadow:var(--sh)}
.av{--s:40px;width:var(--s);height:var(--s);flex:none;border-radius:50%;background:var(--c,var(--pink));border:3px solid var(--ink);display:inline-grid;place-items:center;overflow:hidden;font-size:calc(var(--s)*.5)}
.av img{width:100%;height:100%;object-fit:cover}.av.lg{--s:64px}.av.sm{--s:30px}
.sec{margin:18px 0}
.crayon,.scard,.mcard,.wk,.day,.rcard,.dialog,.tblwrap,.tl-card{border:3px solid var(--ink);border-radius:22px 28px 20px 26px/26px 20px 28px 22px;box-shadow:var(--sh)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.scard{background:#fff linear-gradient(135deg,color-mix(in srgb,var(--c) 55%,#fff),#fff 80%);padding:12px;display:grid;gap:8px;cursor:pointer;animation:pop .35s both;transition:transform .2s}
.scard:hover{transform:translateY(-3px) rotate(-.6deg)}.scard.sel{outline:4px dashed var(--orange);outline-offset:3px}
.scard .si{display:flex;flex-direction:column}.scard h3{font-size:1.15rem}.scard p{margin:0;font-size:.85rem;opacity:.8}
.scard{grid-template-columns:auto 1fr}.scard>.tiles,.scard>.prog,.scard>.btn{grid-column:1/-1}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tile{position:relative;aspect-ratio:1;border:2px dashed var(--ink);border-radius:12px;background:rgba(255,255,255,.7);display:grid;place-items:center;overflow:hidden;font-size:.7rem;text-align:center;padding:2px}
.tile.has{border-style:solid;background:#fff}.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.tile em{position:absolute;bottom:0;right:0;font-style:normal;font-size:.62rem;background:var(--ink);color:#fff;padding:0 4px;border-radius:6px 0 8px 0}
.prog{background:rgba(255,255,255,.75);border:2px solid var(--ink);border-radius:14px;padding:6px 8px}
.prog-top{display:flex;justify-content:space-between;gap:8px;font-size:.88rem}
.segs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:4px}
.seg{position:relative;height:18px;border:2px solid var(--ink);border-radius:8px;background:#eee;overflow:hidden;display:block}
.seg b{position:absolute;left:0;top:0;bottom:0;background:#cfc8d6;transition:width .6s}
.seg.on b{background:var(--orange);background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.3) 0 3px,transparent 3px 7px)}
.seg em{position:absolute;inset:0;font-style:normal;font-size:.65rem;display:grid;place-items:center}
.missions{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.mcard{padding:10px;background:#fff;cursor:pointer;display:grid;gap:4px;transition:transform .2s;animation:pop .35s both;position:relative}
.mcard:hover{transform:translateY(-3px) rotate(1deg)}.mcard.has{background:var(--mint)}.mcard.vac{background:repeating-linear-gradient(45deg,#fff,#fff 8px,#fff7dc 8px,#fff7dc 16px)}
.mcard.today{outline:4px dashed var(--orange);outline-offset:2px}
.mh{display:flex;justify-content:space-between;gap:4px}.mc{font-family:Itim;font-size:1.6rem;line-height:1}
.mw{display:flex;flex-wrap:wrap;gap:3px}.mw i{font-style:normal;font-size:.75rem;background:rgba(255,255,255,.8);border:1.5px solid var(--ink);border-radius:8px;padding:0 6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt{font-size:.75rem;opacity:.75}
.mcard.done{background:#d3f9e5;outline:3px solid #2f9e6e;outline-offset:1px}
.mtarget{display:flex;flex-wrap:wrap;gap:4px}.mtarget span{font-size:.75rem;font-weight:700;background:rgba(255,255,255,.88);border:2px solid var(--ink);border-radius:999px;padding:1px 7px}.mtarget span.done{background:var(--mint)}
.day-targets{display:flex;flex-wrap:wrap;gap:4px;font-size:.72rem;font-weight:700}.day-targets span{background:#fff;border:1.5px solid var(--ink);border-radius:999px;padding:0 6px}.day-targets span.done{background:var(--mint)}
.prog-sub{font-size:.76rem;opacity:.82;margin-top:2px}.seg.done{border-color:#087f5b}.seg.done b{background:#69db9b;background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.35) 0 3px,transparent 3px 7px)}.seg.done em::after{content:' ✓'}
.wcard{position:relative;background:#fff;border:2.5px solid var(--ink);border-radius:14px 18px 13px 17px;padding:7px 9px;display:grid;gap:2px;animation:pop .3s both}
.wcard.en{background:#f0f9ff}.wcard.th{background:#fff4f8}.wcard.hard{background:#fff6c9;border-color:var(--orange)}
.w-main{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.wt{font-size:1.1rem;word-break:break-word}
.lgb{font-size:.65rem;font-weight:700;border:2px solid var(--ink);border-radius:8px;padding:0 5px;background:var(--sky)}.wcard.th .lgb{background:var(--pink)}
.wm{font-size:.92rem}.wr{font-size:.85rem;color:#7a5c8a}.wo{font-size:.72rem;opacity:.7}
.w-act{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.wk{margin:16px 0;background:var(--wc);padding:10px;--wd:#fff}
.wk0{--wc:#ffe0ea}.wk1{--wc:#d8f5e7}.wk2{--wc:#fff4b8}.wk3{--wc:#e6dcff}.wk4{--wc:#d4ebff}.wk5{--wc:#ffe3cc}
.wk-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}
.wk-head .prog{flex:1 1 240px;max-width:420px}
.stat{display:inline-block;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:0 10px;font-size:.8rem;margin:2px}
.wk-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.day{background:rgba(255,255,255,.82);padding:8px;display:flex;flex-direction:column;gap:6px}.day.today{outline:4px dashed var(--orange);outline-offset:2px}
.day-h{display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:space-between}.cnt{background:var(--lemon);border:2px solid var(--ink);border-radius:999px;padding:0 8px;font-size:.8rem}
.day-words{display:grid;gap:6px;align-content:start;flex:1}.empty{opacity:.65;text-align:center;font-size:.9rem;margin:4px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.inp{border:3px solid var(--ink);border-radius:12px 14px 11px 15px;padding:.35em .7em;background:#fff;width:100%}
.toolbar .inp{width:auto}
.segc{display:inline-flex;border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:#fff}
.segc button,.segc label{border:0;background:#fff;padding:.3em .9em;cursor:pointer;font-weight:700}
.segc .on,.segc label:has(input:checked){background:var(--lemon)}.segc input{display:none}
.daystrip{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.off{background:#fff;border-style:dashed;padding:10px;margin-top:16px}
.off h3{margin-bottom:6px}.offgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}.filters .inp{flex:1 1 140px;width:auto}
.tblwrap{background:#fff;overflow:hidden}
.tbl{width:100%;border-collapse:collapse}.tbl th{background:var(--lav);text-align:left;padding:6px 8px;font-size:.85rem}
.tbl td{padding:6px 8px;border-top:2px dashed #d9cfe0;vertical-align:top;word-break:break-word}.tbl .acts{white-space:nowrap}
.tl{list-style:none;margin:0;padding:0 0 0 22px;border-left:4px dashed var(--ink)}
.tl li{position:relative;margin:0 0 10px}.tl .dot{position:absolute;left:-33px;top:12px;width:18px;height:18px;border-radius:50%;border:3px solid var(--ink);background:var(--c,var(--pink))}
.tl-date{font-weight:700;margin:12px 0 6px;font-family:Itim}.tl-date::before{content:"🖍️ "}
.tl-card{background:#fff;padding:8px;display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start}
.tl-card .tlimg{width:64px;height:64px;object-fit:cover;border:2px solid var(--ink);border-radius:12px;cursor:pointer}.tl-card .tlimg.no{display:none}
.tl-meta{font-size:.75rem;opacity:.75}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.rcard{background:#fff;padding:12px;display:grid;gap:6px}.rcard p{margin:0;font-size:.88rem}
.dweek{border:2px dashed var(--ink);border-radius:14px;padding:8px;background:var(--lemon);margin-bottom:8px}
.dchip.zero{opacity:.5}
.dset{margin:12px 0}.dset h4{margin-bottom:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.warn{font-size:.85rem;background:#ffe1e6;border:2px dashed var(--red);border-radius:12px;padding:6px 10px;margin:6px 0}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.dcard{cursor:pointer}.dcard.hide:not(.open) .wm,.dcard.hide:not(.open) .wr{visibility:hidden}
.overlay{position:fixed;inset:0;background:rgba(74,59,82,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto;animation:pop .2s both}
.dialog{background:#fffdf5;width:min(760px,100%);max-height:92vh;max-height:92dvh;overflow:auto;padding:14px;animation:pop .25s both}.dialog.small{width:min(420px,100%)}.dialog.wide{width:min(1020px,100%)}
.dh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.x{border:3px solid var(--ink);background:var(--pink);border-radius:50%;width:34px;height:34px;cursor:pointer;flex:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-bottom:8px}
label.f,div.f{display:grid;gap:3px;font-weight:700;font-size:.9rem;margin-bottom:8px}label.f .inp{font-weight:400}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row.end{justify-content:flex-end}
.irow{display:grid;grid-template-columns:auto 80px minmax(0,1.1fr) minmax(0,1.2fr) minmax(0,1fr) auto;gap:6px;align-items:center;margin-bottom:6px;padding:6px;border:2px dashed #cbbcd3;border-radius:12px;background:#fff}
.irow.dup{background:#ffe1e6;border-color:var(--red)}.irow input[type=checkbox]{width:20px;height:20px}
.prev{max-width:100%;max-height:200px;border:3px solid var(--ink);border-radius:14px;display:block;margin:8px 0}
.full{max-width:100%;border:3px solid var(--ink);border-radius:14px}
.spin{display:inline-block;width:18px;height:18px;border:4px solid var(--ink);border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle}
.badge{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:0 10px;font-size:.78rem;background:var(--mint)}.badge.ocr{background:var(--peach)}
.slist{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:8px}.slist li{display:flex;gap:10px;align-items:center;border:2px solid var(--ink);border-radius:14px;padding:6px 8px;background:#fff}.slist li div{flex:1;display:flex;flex-direction:column}.slist small{opacity:.7}
.slist li input[type=checkbox]{width:20px;height:20px;flex:none}
.sform{border-top:3px dashed var(--ink);padding-top:10px;display:grid;gap:8px}
.sw{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}.swb{width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);cursor:pointer;font-size:1.1rem;background:#fff;padding:0}.swb.on{outline:4px solid var(--orange);outline-offset:1px}
#toasts{position:fixed;left:0;right:0;bottom:14px;z-index:99;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 10px}
.toast{background:var(--ink);color:#fff;border-radius:16px;padding:8px 16px;animation:pop .25s both;box-shadow:var(--sh);max-width:100%;text-align:center}
.note{font-size:.85rem;background:var(--lemon);border:2px dashed var(--ink);border-radius:12px;padding:6px 10px;margin:6px 0}
.sheet-ta{width:100%;min-height:150px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.84rem;line-height:1.5;white-space:pre;overflow:auto}
details.sheet-help{border:2px dashed var(--ink);border-radius:14px;padding:8px 10px;margin:8px 0;background:#fff}
details.sheet-help summary{cursor:pointer;font-weight:700}
.sheet-summary{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}
.badge.warn{background:var(--lemon)}.badge.bad{background:var(--pink);color:#71182a}.badge.gray{background:#eee7f3}
.srow{border:2.5px solid #cbbcd3;border-radius:16px;background:#fff;padding:8px;margin:8px 0}
.srow.warnrow{border-color:#d9a400;background:#fff9d8}.srow.bad{border-color:var(--red);background:#fff0f3}
.srow-top{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:7px}.srow-top .sp{flex:1}
.sheet-check{display:inline-flex;gap:6px;align-items:center}.sheet-check input,.srow-top input[type=checkbox]{width:20px;height:20px}
.srow-grid{display:grid;grid-template-columns:145px minmax(145px,.9fr) 92px minmax(150px,1.15fr) minmax(140px,1fr) minmax(140px,1fr);gap:7px}
.srow-grid label{display:grid;gap:2px;font-size:.78rem;font-weight:700}.srow-grid .inp{font-weight:400;padding:.3em .55em;border-width:2px}
.rowmeta{font-size:.8rem;margin-top:5px}.rowmeta.badmsg{color:#a11636;font-weight:700}.rowmeta.warnmsg{color:#7a5a00}
@media (max-width:900px){.srow-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.srow-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.sheet-ta{min-height:130px}}
@media (max-width:1000px){.wk-grid{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}}
@media (max-width:700px){
 #app{padding:8px 8px 80px}.brand h1{font-size:1.2rem}.actions{width:100%}.actions .btn{flex:1 1 auto;padding:.4em .6em}
 .wk-grid{grid-template-columns:1fr}.overlay{align-items:flex-end;padding:0}.dialog{border-radius:24px 24px 0 0;max-height:94dvh;width:100%}
 .irow{grid-template-columns:auto 1fr auto}.irow>select{grid-column:2}.irow>input.inp{grid-column:1/-1}.irow>button{grid-column:3;grid-row:1}
 .tbl thead{display:none}.tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}.tbl tr{border-top:3px solid var(--ink);padding:6px 4px}
 .tbl td{border:0;display:flex;justify-content:space-between;gap:10px;padding:2px 6px;text-align:right}.tbl td::before{content:attr(data-label);font-weight:700;text-align:left;opacity:.7;flex:none}.tbl td.acts{justify-content:flex-end}.tbl td.acts::before{content:""}
 .tl-card{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.missions{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}

.flash{border:3px solid var(--ink);border-radius:24px;background:linear-gradient(145deg,#fff,#fff4f8);box-shadow:var(--sh);min-height:230px;display:grid;place-items:center;text-align:center;padding:24px;margin:12px 0}
.flash .fw{font-family:'Itim','Mali',sans-serif;font-size:clamp(2rem,8vw,3.4rem);line-height:1.15;word-break:break-word}
.flash .fa{font-size:1.12rem;margin-top:10px;line-height:1.55}
.pl-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-top:8px}
.pl-nav,.pl-main{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.pl-main{margin-left:auto;justify-content:flex-end}
@media (max-width:700px){.pl-nav,.pl-main{flex:1 1 100%}.pl-main{margin-left:0}.pl-nav .btn,.pl-main .btn{flex:1 1 auto}}
</style>
</head>
<body>
<div id="app"><div id="hdr"></div><main id="view"></main></div>

<script>
'use strict';

/* ====== Utils ====== */
const $ = (s, r = document) => r.querySelector(s),
  $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s !== null && s !== void 0 ? s : '').replace(/[&<>"']/g, c => ({
  '&': '&amp;',
  '<': '&lt;',
  '>': '&gt;',
  '"': '&quot;',
  "'": '&#39;'
})[c]);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const fmt = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d, 12);
};
const addDays = (s, n) => {
  const d = parse(s);
  d.setDate(d.getDate() + n);
  return fmt(d);
};
const today = () => fmt(new Date());
const dow = s => (parse(s).getDay() + 6) % 7;
const weekStart = s => addDays(s, -dow(s));
const TH_DAYS = ['จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์', 'อาทิตย์'];
const TH_SHORT = ['จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส', 'อา'];
const TH_MON = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const fdate = s => {
  const d = parse(s);
  return `${d.getDate()} ${TH_MON[d.getMonth()]}`;
};
const fdateY = s => {
  const d = parse(s);
  return `${d.getDate()} ${TH_MON[d.getMonth()]} ${String(d.getFullYear() + 543).slice(2)}`;
};
const norm = t => String(t || '').toLowerCase().replace(/\s+/g, ' ').trim();
const shuffle = a => {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};
const COLORS = ['#ffb3c7', '#a8e6cf', '#fff1a8', '#cdb4ff', '#a8d8ff', '#ffcba4', '#ffd6e8', '#b5ead7'];
const EMOJIS = ['🦌', '🐰', '🐻', '🐼', '🐱', '🐶', '🦊', '🐸', '🦄', '🐧', '🐥', '🌈'];
const DAY_TARGETS = {
  th: 10,
  en: 7
};
const DAY_MAX = DAY_TARGETS.th + DAY_TARGETS.en;
const WEEK_TARGETS = {
  th: DAY_TARGETS.th * 5,
  en: DAY_TARGETS.en * 5
};
const WEEK_MAX = WEEK_TARGETS.th + WEEK_TARGETS.en;
const LANG_LABEL = {
  th: 'ไทย',
  en: 'EN'
};
console.assert(weekStart('2025-09-26') === '2025-09-22' && dow('2025-09-27') === 5 && addDays('2025-12-31', 1) === '2026-01-01', 'date helpers self-check');

/* ====== Database (IndexedDB, in-memory fallback) ====== */
const DB = {
  db: null,
  mem: null,
  stores: ['students', 'words', 'drills', 'images', 'full', 'settings'],
  async open() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('littlefawn-wordstudio', 1);
        r.onupgradeneeded = () => this.stores.forEach(n => {
          if (!r.result.objectStoreNames.contains(n)) r.result.createObjectStore(n, {
            keyPath: 'id'
          });
        });
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
        r.onblocked = () => rej(new Error('blocked'));
      });
    } catch (e) {
      console.warn(e);
      this.db = null;
      this.mem = {};
      this.stores.forEach(n => this.mem[n] = new Map());
      setTimeout(() => toast('⚠️ ใช้ฐานข้อมูลในเบราว์เซอร์ไม่ได้ ข้อมูลจะหายเมื่อปิดหน้า'), 500);
    }
  },
  run(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode);
      const st = t.objectStore(store);
      let r;
      try {
        r = fn(st);
      } catch (e) {
        rej(e);
        return;
      }
      t.oncomplete = () => res(r && r.result !== undefined ? r.result : undefined);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    });
  },
  all(s) {
    return this.db ? this.run(s, 'readonly', o => o.getAll()).then(x => x || []) : Promise.resolve([...this.mem[s].values()]);
  },
  get(s, id) {
    return this.db ? this.run(s, 'readonly', o => o.get(id)) : Promise.resolve(this.mem[s].get(id));
  },
  put(s, o) {
    if (!this.db) {
      this.mem[s].set(o.id, o);
      return Promise.resolve();
    }
    return this.run(s, 'readwrite', st => {
      st.put(o);
    });
  },
  putMany(s, a) {
    if (!this.db) {
      a.forEach(o => this.mem[s].set(o.id, o));
      return Promise.resolve();
    }
    return this.run(s, 'readwrite', st => {
      a.forEach(o => st.put(o));
    });
  },
  del(s, ids) {
    ids = [].concat(ids);
    if (!this.db) {
      ids.forEach(i => this.mem[s].delete(i));
      return Promise.resolve();
    }
    return this.run(s, 'readwrite', st => {
      ids.forEach(i => st.delete(i));
    });
  }
};

/* ====== Migration: Word Studio v1 (Local Storage) -> IndexedDB ======
   เปิด v3 ครั้งแรกในเบราว์เซอร์เดิม จะย้ายนักเรียน/คำศัพท์/รูป/ชุดฝึกจาก v1 ให้อัตโนมัติ (ครั้งเดียว ไม่ลบข้อมูลต้นฉบับ) */
async function migrateV1() {
  try {
    const raw = localStorage.getItem('Little_Fawn_WORD_STUDIO_V1');
    if (!raw) return 0;
    if (await DB.get('settings', 'migrated-v1')) return 0;
    const old = JSON.parse(raw);
    if (!old || !Array.isArray(old.students)) return 0;
    const base = Date.now();
    const stuIds = new Set((await DB.all('students')).map(x => x.id));
    const students = old.students.filter(x => x && x.id && x.name && !stuIds.has(x.id)).map((x, i) => ({
      id: x.id,
      name: String(x.name),
      level: [x.level, x.age].filter(Boolean).join(' • '),
      color: x.color || COLORS[i % COLORS.length],
      emoji: x.avatar || x.emoji || '🦌',
      photo: x.photo || '',
      createdAt: x.createdAt || base + i
    }));
    if (students.length) await DB.putMany('students', students);
    const validStu = new Set([...stuIds, ...students.map(x => x.id)]);
    const wordIds = new Set((await DB.all('words')).map(x => x.id));
    const words = (Array.isArray(old.words) ? old.words : []).filter(w => w && w.id && w.word && w.date && validStu.has(w.studentId) && !wordIds.has(w.id)).map((w, i) => ({
      id: w.id,
      sid: w.studentId,
      date: w.date,
      lang: w.lang === 'th' ? 'th' : 'en',
      text: String(w.word),
      meaning: w.meaning || '',
      reading: w.reading || '',
      hard: !!w.difficult,
      source: w.source || 'manual',
      imageId: w.imageId || '',
      createdAt: w.createdAt || base + 1000 + i
    }));
    if (words.length) await DB.putMany('words', words);
    const imIds = new Set((await DB.all('images')).map(x => x.id));
    for (const [id, data] of Object.entries(old.images || {})) {
      if (typeof data !== 'string' || !data.startsWith('data:image')) continue;
      if (!imIds.has(id)) await DB.put('images', {
        id,
        thumb: data
      });
      if (!(await DB.get('full', id))) await DB.put('full', {
        id,
        data
      });
    }
    const allMap = new Map((await DB.all('words')).map(w => [w.id, w]));
    const drillIds = new Set((await DB.all('drills')).map(x => x.id));
    const drills = (Array.isArray(old.sets) ? old.sets : []).filter(d => d && d.id && !drillIds.has(d.id) && validStu.has(d.studentId)).map(d => {
      const ids = (Array.isArray(d.items) ? d.items : []).map(x => x && x.wordId).filter(id => allMap.has(id));
      const dates = ids.map(id => allMap.get(id).date).sort(),
        cd = d.createdAt || base,
        cdISO = fmt(new Date(cd));
      return {
        id: d.id,
        sid: d.studentId,
        kind: d.type === 'hard' ? 'hard' : 'practice',
        createdAt: cd,
        date: cdISO,
        from: dates[0] || cdISO,
        to: dates[dates.length - 1] || cdISO,
        wordIds: ids,
        migratedFrom: 'v1'
      };
    }).filter(d => d.wordIds.length);
    if (drills.length) await DB.putMany('drills', drills);
    if (old.activeStudentId && validStu.has(old.activeStudentId) && !localStorage.getItem('lf_sid')) localStorage.setItem('lf_sid', old.activeStudentId);
    await DB.put('settings', {
      id: 'migrated-v1',
      at: Date.now(),
      students: students.length,
      words: words.length,
      drills: drills.length
    });
    if (words.length || students.length) setTimeout(() => toast(`🔄 อัปเดตเป็น v3: ย้ายข้อมูลเดิม ${words.length} คำให้เรียบร้อย`), 700);
    return words.length;
  } catch (e) {
    console.warn('v1 migration skipped', e);
    return 0;
  }
}

/* ====== State ====== */
const S = {
  students: [],
  words: [],
  drills: [],
  thumbs: {},
  cfg: {
    provider: 'gemini',
    key: '',
    model: '',
    base: '',
    models: {},
    keys: {
      gemini: '',
      openai: '',
      openrouter: ''
    },
    bases: {
      openai: '',
      openrouter: 'https://openrouter.ai/api/v1'
    },
    presetsVersion: 3
  }
};
const ui = {
  tab: 'home',
  sid: null,
  ws: weekStart(today()),
  day: today(),
  mode: 'week',
  nweeks: 1,
  q: '',
  fstu: 'all',
  flang: 'all',
  fhard: false,
  libN: 100,
  tlAll: false,
  tlN: 15,
  hide: false,
  drDays: [],
  drInit: false,
  drLang: 'en',
  drPer: 15,
  drSets: 2,
  drStar: true,
  drAi: false,
  drBusy: false
};
const SHOW_API_UI = false; /* v3.5: ซ่อนส่วน API key และตัวเลือกที่ใช้ API ไว้ก่อน (ไม่ลบคีย์/ค่าที่เคยบันทึกในเครื่อง) */
const PROVIDERS = {
  gemini: 'Google Gemini',
  openai: 'OpenAI',
  openrouter: 'OpenRouter'
};
function normalizeCfg() {
  const c = S.cfg;
  if (!PROVIDERS[c.provider]) c.provider = 'gemini';
  if (!c.models) c.models = {};
  c.keys = {
    gemini: '',
    openai: '',
    openrouter: '',
    ...(c.keys || {})
  };
  c.bases = {
    openai: '',
    openrouter: 'https://openrouter.ai/api/v1',
    ...(c.bases || {})
  };
  if (c.key && !c.keys[c.provider]) c.keys[c.provider] = c.key;
  if (c.provider !== 'gemini' && c.base && !c.bases[c.provider]) c.bases[c.provider] = c.base;
  if (!c.bases.openrouter) c.bases.openrouter = 'https://openrouter.ai/api/v1';
  if (c.presetsVersion !== 3) {
    if (Array.isArray(c.models.gemini)) {
      // เพิ่มโมเดลฟรีรุ่นใหม่ให้บัญชีเดิมโดยไม่ทับลำดับที่ผู้ใช้จัดเอง
      [['gemini-3-flash-preview', true], ['gemini-3.1-flash-lite', true]].forEach(([id, on]) => {
        if (!c.models.gemini.some(m => m.id === id)) c.models.gemini.splice(1, 0, {
          id,
          on
        });
      });
    }
    c.presetsVersion = 3;
  }
  c.key = c.keys[c.provider] || '';
  c.base = c.provider === 'gemini' ? '' : c.bases[c.provider] || '';
  return c;
}
const stu = id => S.students.find(s => s.id === id);
const cur = () => stu(ui.sid) || S.students[0];
const dayWords = (sid, d) => S.words.filter(w => w.sid === sid && w.date === d).sort((a, b) => a.createdAt - b.createdAt);
const rangeWords = (sid, a, b) => S.words.filter(w => w.sid === sid && w.date >= a && w.date <= b);
const newStudent = (name, level, color, emoji, photo) => ({
  id: uid(),
  name,
  level,
  color,
  emoji,
  photo: photo || '',
  createdAt: Date.now()
});
const avatar = (s, sz = '') => `<span class="av ${sz}" style="--c:${s.color}">${s.photo ? `<img src="${s.photo}" alt="">` : esc(s.emoji || s.name[0])}</span>`;
function dayCounts(sid, d, list) {
  const L = list || dayWords(sid, d),
    th = L.filter(w => w.lang === 'th').length,
    en = L.filter(w => w.lang === 'en').length;
  const remainTh = Math.max(0, DAY_TARGETS.th - th),
    remainEn = Math.max(0, DAY_TARGETS.en - en);
  return {
    th,
    en,
    total: L.length,
    remainTh,
    remainEn,
    remain: remainTh + remainEn,
    complete: remainTh === 0 && remainEn === 0
  };
}
const dayTargetText = c => `ไทย ${c.th}/${DAY_TARGETS.th} • EN ${c.en}/${DAY_TARGETS.en}`;
function weekProgress(sid, ws) {
  const days = [0, 1, 2, 3, 4].map(i => dayCounts(sid, addDays(ws, i)));
  const sum = k => days.reduce((a, c) => a + c[k], 0);
  return {
    days,
    th: sum('th'),
    en: sum('en'),
    total: sum('total'),
    remainTh: sum('remainTh'),
    remainEn: sum('remainEn'),
    remain: sum('remain')
  };
}
function progressHTML(sid, ws) {
  const p = weekProgress(sid, ws);
  return `<div class="prog"><div class="prog-top"><b>${p.remain ? `เหลือ ไทย ${p.remainTh} + EN ${p.remainEn}` : 'ครบเป้าหมายทั้งสัปดาห์แล้ว 🎉'}</b><span>${p.total}/${WEEK_MAX}</span></div><div class="prog-sub">เป้าหมาย จ–ศ: ไทย ${p.th}/${WEEK_TARGETS.th} • EN ${p.en}/${WEEK_TARGETS.en}</div><div class="segs">${p.days.map((c, i) => `<i class="seg ${c.total > 0 ? 'on' : ''} ${c.complete ? 'done' : ''}" title="${TH_DAYS[i]}: ไทย ${c.th}/${DAY_TARGETS.th}, EN ${c.en}/${DAY_TARGETS.en}"><b style="width:${Math.min(100, (Math.min(c.th, DAY_TARGETS.th) + Math.min(c.en, DAY_TARGETS.en)) * 100 / DAY_MAX)}%"></b><em>${TH_SHORT[i]} ${c.total}</em></i>`).join('')}</div></div>`;
}

/* ====== Toast / modal / confirm ====== */
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), 3200);
}
const M = [];
function openModal(render, o = {}) {
  const el = document.createElement('div');
  el.className = 'overlay';
  const dlg = document.createElement('div');
  dlg.className = 'dialog ' + (o.cls || '');
  dlg.innerHTML = render();
  el.appendChild(dlg);
  const m = {
    el,
    dlg,
    render,
    live: !!o.live,
    res: null
  };
  el.addEventListener('mousedown', e => {
    if (e.target === el && o.bd) closeModal(m);
  });
  $('#modals').appendChild(el);
  M.push(m);
  document.body.classList.add('noscroll');
  return m;
}
function closeModal(m) {
  const i = M.indexOf(m);
  if (i < 0) return;
  M.splice(i, 1);
  m.el.remove();
  if (m.res) m.res(false);
  if (!M.length) document.body.classList.remove('noscroll');
}
const modalOf = el => M.find(m => m.el.contains(el));
function ask(title, msg, ok = 'ลบเลย') {
  return new Promise(res => {
    const m = openModal(() => `<h3>${esc(title)}</h3><p>${msg}</p><div class="row end"><button class="btn" data-act="ask-no">ยกเลิก</button><button class="btn danger" data-act="ask-yes">${esc(ok)}</button></div>`, {
      cls: 'small',
      bd: true
    });
    m.res = res;
  });
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && M.length) closeModal(M[M.length - 1]);
});
function shakeEls(els) {
  els.forEach(e => {
    e.classList.remove('shake');
    void e.offsetWidth;
    e.classList.add('shake');
    setTimeout(() => e.classList.remove('shake'), 900);
  });
}
const shakeWord = id => shakeEls($$(`[data-wid="${id}"]`));

    const d = addDays(cw, i),
      L = dayWords(s.id, d),
      w = L.find(x => x.imageId && S.thumbs[x.imageId]);
    return `<div class="tile ${L.length ? 'has' : ''}" title="${fdate(d)}">${w ? `<img src="${S.thumbs[w.imageId]}" alt="">` : `<span>${L[0] ? esc(L[0].text) : '–'}</span>`}<em>${TH_SHORT[i]}</em></div>`;
  }).join('');
  return `<article class="scard ${s.id === ui.sid ? 'sel' : ''}" style="--c:${s.color}" data-act="pick-stu" data-id="${s.id}">${avatar(s, 'lg')}<div class="si"><h3>${esc(s.name)}</h3><p>${esc(s.level || '')}</p></div><div class="tiles">${days}</div>${progressHTML(s.id, cw)}<button class="btn small" data-act="go-week" data-id="${s.id}">📅 ดูตารางของ ${esc(s.name)}</button></article>`;

  }).join('');

function timelineHTML() {
  const L = S.words.filter(w => (w.imageId || ['image', 'gemini-app', 'google-sheets', 'sheet'].includes(w.source)) && (ui.tlAll || w.sid === ui.sid)).sort((a, b) => b.createdAt - a.createdAt);
  const head = `<div class="row" style="margin-bottom:8px"><div class="segc"><button class="${!ui.tlAll ? 'on' : ''}" data-act="tl-all" data-v="0">เฉพาะ ${esc(cur().name)}</button><button class="${ui.tlAll ? 'on' : ''}" data-act="tl-all" data-v="1">ทุกคน</button></div></div>`;
  if (!L.length) return head + `<div class="note">ยังไม่มีคำศัพท์ที่นำเข้า ลองกด “📋 นำเข้าจาก Sheets” ได้เลย</div>`;
  let last = '',
    html = '';
  L.slice(0, ui.tlN).forEach(w => {

    }

 <div class="wk-grid">${[0, 1, 2, 3, 4].map(i => dayCol(sid, addDays(ws, i))).join('')}</div></section>`;

function offTable(sid, from, to) {

/* --- Drills: เลือกวัน → สุ่มคำยากระดับ ป.3 → แบ่งเป็นชุด --- */
/* คะแนนความยากโดยประมาณ (ไม่ใช้ดาว) — ยิ่งสูงยิ่งยากสำหรับเด็ก ป.3 */
function hardScore(w) {
  const t = String(w.text || '').trim();
  let s = 0;
  const isTh = w.lang === 'th' || /[\u0E00-\u0E7F]/.test(t) && !/[A-Za-z]/.test(t);
  if (isTh) {
    const n = [...t].filter(c => /[\u0E01-\u0E4E]/.test(c)).length;
    s += n >= 8 ? 3 : n >= 6 ? 2 : n >= 4 ? 1 : 0;
    if (/\u0E4C/.test(t)) s += 1.5;
    if (/[ศษฬฑฒณธฌฎฏฐฆฅฃฝฤฦ]/.test(t)) s += 1;
    if (/[กขคตปพผ][รลว]/.test(t)) s += 1;
    const syl = w.reading ? String(w.reading).split(/[-\s]+/).filter(Boolean).length : 0;
    s += syl >= 4 ? 1 : syl >= 3 ? .5 : 0;
  } else {
    const lower = t.toLowerCase(),
      n = lower.replace(/[^a-z]/g, '').length;
    s += n >= 10 ? 3 : n >= 8 ? 2.5 : n >= 6 ? 1.5 : n >= 5 ? .5 : 0;
    if (/\s/.test(t)) s += 1;
    let g = (lower.match(/[aeiouy]+/g) || []).length;
    if (/[^aeiouy]e$/.test(lower) && !/le$/.test(lower) && g > 1) g--;
    s += g >= 4 ? 2 : g >= 3 ? 1 : 0;
    const pats = [/ough/, /augh/, /eigh/, /tion/, /sion/, /cious/, /tious/, /ture/, /ph/, /gh/, /^kn/, /^wr/, /mb$/, /^ps/, /sch/, /ei/, /ie/];
    s += Math.min(1.5, pats.filter(r => r.test(lower)).length * .75);
  }
  return s;
}
function weightedPick(arr, wf) {
  const ws = arr.map(wf),
    tot = ws.reduce((a, b) => a + b, 0);
  let r = Math.random() * tot;
  for (let i = 0; i < arr.length; i++) {
    r -= ws[i];
    if (r <= 0) return arr[i];
  }
  return arr[arr.length - 1];
}
async function aiDifficulty(words, score) {
  const out = new Map();
  const list = words.map((w, n) => ({
    n,
    lang: w.lang,
    word: w.text,
    s: score.get(w.id) || 0
  })).sort((a, b) => b.s - a.s).slice(0, 300).map(({
    n,
    lang,
    word
  }) => ({
    n,
    lang,
    word
  }));
  for (let i = 0; i < list.length; i += 100) {
    const chunk = list.slice(i, i + 100);
    const p = `Rate how difficult each vocabulary word is for a Thai Grade 3 (ป.3, about 9 years old) student, from 1 (very easy) to 5 (very hard). English words: consider spelling, length, and whether it is beyond typical primary-school vocabulary. Thai words: consider spelling difficulty, silent letters (การันต์), consonant clusters, rare consonants and word length. Input: ${JSON.stringify(chunk)}. Return ONLY JSON {"items":[{"n":0,"level":3}]}`;
    const r = await llm(p);
    (Array.isArray(r) ? r : r.items || []).forEach(x => {
      const w = words[x.n],
        lv = +x.level;
      if (w && lv >= 1 && lv <= 5) out.set(w.id, lv);
    });
  }
  return out;
}
async function buildDrill(sid, days, o) {
  const per = o.per,
    nSets = o.sets,
    total = per * nSets;
  const lang = o.lang === 'th' ? 'th' : 'en',
    wordsFor = d => dayWords(sid, d).filter(w => w.lang === lang);
  let ds = [...new Set(days)].sort().filter(d => wordsFor(d).length);
  if (!ds.length) return null;
  let skipped = 0;
  const maxDays = Math.max(1, Math.floor(total / 2));
  if (ds.length > maxDays) {
    skipped = ds.length - maxDays;
    ds = shuffle(ds).slice(0, maxDays).sort();
  }
  const all = ds.flatMap(d => wordsFor(d));
  const score = new Map(all.map(w => [w.id, hardScore(w)]));
  let usedAI = false;
  if (SHOW_API_UI && o.ai && S.cfg.key) {
    try {
      const r = await aiDifficulty(all, score);
      r.forEach((lv, id) => score.set(id, lv * 1.6));
      usedAI = r.size > 0;
    } catch (e) {
      console.warn(e);
      toast('AI ประเมินไม่ได้ ใช้เกณฑ์ในเครื่องแทน');
    }
  }
  const weight = w => Math.pow(1.6, score.get(w.id) || 0) * (o.star && w.hard ? 3 : 1);
  const rem = new Map(ds.map(d => [d, shuffle(wordsFor(d))])),
    cnt = new Map(ds.map(d => [d, 0])),
    picked = [];
  /* วนเลือกทีละวัน วันที่ถูกเลือกน้อยสุดก่อน → ทุกวันได้อย่างน้อย 2 คำ (ถ้ามีคำพอ) */
  while (picked.length < total) {
    const cands = ds.filter(d => rem.get(d).length);
    if (!cands.length) break;
    const mn = Math.min(...cands.map(d => cnt.get(d))),
      tie = cands.filter(d => cnt.get(d) === mn);
    const d = tie[Math.floor(Math.random() * tie.length)],
      w = weightedPick(rem.get(d), weight);
    picked.push(w);
    cnt.set(d, cnt.get(d) + 1);
    const k = norm(w.text);
    rem.forEach((a, key) => rem.set(key, a.filter(x => norm(x.text) !== k)));
  }
  /* แจกเข้าชุด ให้แต่ละชุดมีคำจากหลายวัน */
  const sets = Array.from({
    length: nSets
  }, () => ({
    ids: [],
    days: new Set()
  }));
  picked.forEach(w => {
    const open = sets.filter(x => x.ids.length < per);
    if (!open.length) return;
    const fresh = open.filter(x => !x.days.has(w.date)),
      c = fresh.length ? fresh : open;
    const mn = Math.min(...c.map(x => x.ids.length)),
      t = c.filter(x => x.ids.length === mn),
      x = t[Math.floor(Math.random() * t.length)];
    x.ids.push(w.id);
    x.days.add(w.date);
  });
  return {
    id: uid(),
    sid,
    kind: 'mix',
    lang,
    createdAt: Date.now(),
    days: ds,
    perSet: per,
    star: !!o.star,
    ai: usedAI,
    poolSize: all.length,
    skipped,
    sets: sets.filter(x => x.ids.length).map(x => ({
      wordIds: shuffle(x.ids)
    }))
  };
}

function loadImage(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = () => res(im);
      im.onerror = () => rej(new Error('เปิดรูปไม่ได้'));
      im.src = fr.result;
    };
    fr.onerror = () => rej(new Error('อ่านไฟล์ไม่ได้'));
    fr.readAsDataURL(file);
  });
}
function scale(im, max, q) {
  const k = Math.min(1, max / Math.max(im.width, im.height)),
    c = document.createElement('canvas');
  c.width = Math.round(im.width * k);
  c.height = Math.round(im.height * k);
  const x = c.getContext('2d');
  x.fillStyle = '#fff';
  x.fillRect(0, 0, c.width, c.height);
  x.drawImage(im, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}
function loadScript(src) {
  return new Promise((res, rej) => {
    if ($(`script[src="${src}"]`)) return res();
    const s = document.createElement('script');
    s.src = src;
    s.onload = res;
    s.onerror = () => rej(new Error('โหลด OCR ไม่ได้ (ต้องออนไลน์)'));
    document.head.appendChild(s);
  });
}

function parseJSON(t) {
  t = String(t).replace(/^\s*```(?:json)?/i, '').replace(/```\s*$/, '').trim();
  try {
    return JSON.parse(t);
  } catch {
    const m = t.match(/[\[{][\s\S]*[\]}]/);
    if (m) return JSON.parse(m[0]);
    throw new Error('ผลลัพธ์ไม่ใช่ JSON');
  }
}

  const rows = parseDelimitedText(simp.raw);
  if (!rows.length) {
    simp.items = [];
    simp.msg = 'ไม่พบข้อมูลตาราง ลองคัดลอกช่วงเซลล์จาก Google Sheets หรือเลือกไฟล์ CSV/TSV';
    renderSheetImp();
    return;
  }
  let items = sheetRowsToItems(rows);
  const capped = items.length > 500;
  if (capped) items = items.slice(0, 500);
  simp.items = items;
  validateSheetItems();
  const st = sheetStats();
  simp.msg = items.length ? `อ่าน${origin}ได้ ${items.length} แถว • พร้อมบันทึก ${st.ready} แถว${st.blocked ? ` • ต้องแก้ ${st.blocked} แถว` : ''}${capped ? ' • ข้อมูลเกิน 500 แถว ระบบตรวจเฉพาะ 500 แถวแรก' : ''} • ตรวจ/แก้แต่ละแถวก่อนบันทึกได้` : 'พบเฉพาะหัวตารางหรือแถวว่าง ยังไม่มีคำศัพท์ให้ตรวจ';
  renderSheetImp();
}

const Sync = {
  enabled: false,
  user: null,
  status: 'off',
  msg: '',
  tombs: {},
  remote: null,
  remoteTombs: null,
  ready: 0,
  unsubs: [],
  pend: 0,
  live: false,
  gen: 0,
  q: Promise.resolve(),
  DATA: ['students', 'words', 'drills', 'images'],
  ALL: ['students', 'words', 'drills', 'images', 'full'],
  icon() {
    return !this.enabled ? '' : !this.user ? '☁️' : this.status === 'ok' ? '☁️✓' : this.status === 'error' ? '☁️⚠️' : '☁️⏳';
  },
  loadTombs(r) {
    this.tombs = r && r.map || {};
  },
  saveTombs() {
    return DB.raw.put('settings', {
      id: 'tombs',
      map: this.tombs
    });
  },
  col(n) {
    return this.fs.collection('users').doc(this.user.uid).collection(n);
  },
  init() {
    if (!FIREBASE_CONFIG.apiKey) return;
    if (!window.firebase) {
      this.status = 'error';
      this.msg = 'โหลด Firebase SDK ไม่ได้ (ต้องออนไลน์)';
      return;
    }
    try {
      firebase.initializeApp(FIREBASE_CONFIG);
      this.auth = firebase.auth();
      this.fs = firebase.firestore();
      this.enabled = true;
      this.status = 'login';
      this.auth.onAuthStateChanged(u => {
        this.stop();
        this.user = u;
        if (u) this.start();else {
          this.status = 'login';
          this.msg = '';
        }
        uiRefresh();
      });
    } catch (e) {
      this.fail(e);
    }
  },
  signIn(e, p) {
    return this.auth.signInWithEmailAndPassword(e, p);
  },
  signUp(e, p) {
    return this.auth.createUserWithEmailAndPassword(e, p);
  },
  signOut() {
    return this.auth.signOut();
  },
  stop() {
    this.gen++;
    this.unsubs.forEach(f => {
      try {
        f();
      } catch {}
    });
    this.unsubs = [];
    this.live = false;
    this.pend = 0;
  },
  start() {
    const g = ++this.gen;
    this.status = 'syncing';
    this.msg = 'กำลังซิงก์…';
    this.ready = 0;
    this.live = false;
    this.pend = 0;
    this.remote = {
      students: new Map(),
      words: new Map(),
      drills: new Map(),
      images: new Map()
    };
    this.remoteTombs = new Set();
    const names = [...this.DATA, 'tombs'];
    names.forEach(n => {
      let first = true;
      this.unsubs.push(this.col(n).onSnapshot(snap => {
        this.q = this.q.then(async () => {
          if (g !== this.gen) return;
          await this.onSnap(n, snap);
          if (first) {
            first = false;
            if (++this.ready === names.length) await this.reconcile();
          }
        }).catch(e => this.fail(e));
      }, e => this.fail(e)));
    });
    uiRefresh();
  },
  async onSnap(n, snap) {
    let changed = false;
    for (const ch of snap.docChanges()) {
      if (ch.type === 'removed') continue;
      const r = ch.doc.data();
      if (n === 'tombs') {
        const k = r.s + '/' + r.id;
        this.remoteTombs.add(k);
        if (!(this.tombs[k] >= r.at)) {
          this.tombs[k] = r.at;
          await this.saveTombs();
        }
        const loc = await DB.get(r.s, r.id);
        if (loc && (loc.updatedAt || 0) <= r.at) {
          await DB.raw.del(r.s, r.id);
          changed = true;
        }
      } else {
        this.remote[n].set(r.id, r.updatedAt || 0);
        const t = this.tombs[n + '/' + r.id];
        if (t !== undefined && t >= (r.updatedAt || 0)) continue;
        const loc = await DB.get(n, r.id);
        if (!loc || (loc.updatedAt || 0) < (r.updatedAt || 0)) {
          await DB.raw.put(n, r);
          changed = true;
        }
      }
    }
    if (changed && this.live) {
      await reloadState();
      uiRefresh();
    }
  },
  async reconcile() {
    this.live = true;
    const stuL = await DB.all('students'),
      wordL = await DB.all('words');
    // เครื่องใหม่: ทิ้งนักเรียนตั้งต้นที่ยังว่าง ถ้าในคลาวด์มีนักเรียนอยู่แล้ว
    if (this.remote.students.size) {
      for (const s of stuL) {
        if (s.isDefault && !this.remote.students.has(s.id) && !wordL.some(w => w.sid === s.id)) {
          await DB.raw.del('students', s.id);
          for (const d of await DB.all('drills')) if (d.sid === s.id) await DB.raw.del('drills', d.id);
        }
      }
    }
    // ส่งบันทึกการลบที่ค้างอยู่
    for (const [k, at] of Object.entries(this.tombs)) {
      const i = k.indexOf('/'),
        n = k.slice(0, i),
        id = k.slice(i + 1),
        loc = await DB.get(n, id),
        dead = !loc || (loc.updatedAt || 0) <= at;
      if (loc && dead) await DB.raw.del(n, id);
      if (!this.remoteTombs.has(k)) {
        const ops = [this.col('tombs').doc(n + '__' + id).set({
          s: n,
          id,
          at
        })];
        if (dead) ops.push(this.col(n).doc(id).delete());
        this.track(Promise.all(ops));
      }
    }
    // ส่งข้อมูลในเครื่องที่ใหม่กว่า/ยังไม่มีในคลาวด์
    for (const n of this.DATA) {
      const out = [];
      for (const r of await DB.all(n)) {
        const t = this.tombs[n + '/' + r.id];
        if (t !== undefined && t >= (r.updatedAt || 0)) {
          await DB.raw.del(n, r.id);
          continue;
        }
        if (!r.updatedAt) {
          r.updatedAt = Date.now();
          await DB.raw.put(n, r);
        }
        const ru = this.remote[n].get(r.id);
        if (ru === undefined || r.updatedAt > ru) out.push(r);
      }
      if (out.length) this.track(this.pushDocs(n, out));
      if (n === 'images' && out.length) {
        const fl = [];
        for (const r of out) {
          const f = await DB.get('full', r.id);
          if (f) fl.push(f);
        }
        if (fl.length) this.track(this.pushDocs('full', fl));
      }
    }
    await reloadState();
    this.settle();
    uiRefresh();
  },
  async pushDocs(n, list) {
    for (let i = 0; i < list.length; i += 10) {
      await Promise.all(list.slice(i, i + 10).map(r => {
        if (n === 'full' && (r.data || '').length > 900000) {
          console.warn('รูปใหญ่เกิน 1MB ไม่ซิงก์', r.id);
          return;
        }
        return this.col(n).doc(r.id).set(r);
      }));
    }
  },
  push(n, list) {
    if (!this.live || !this.user || !this.ALL.includes(n)) return;
    this.track(this.pushDocs(n, list));
  },
  remove(n, ids) {
    if (!this.ALL.includes(n)) return;
    const at = Date.now();
    ids.forEach(id => {
      this.tombs[n + '/' + id] = at;
    });
    this.saveTombs();
    if (!this.live || !this.user) return;
    this.track(Promise.all(ids.flatMap(id => [this.col(n).doc(id).delete(), this.col('tombs').doc(n + '__' + id).set({
      s: n,
      id,
      at
    })])));
  },
  async fetchFull(id) {
    if (!this.user) return null;
    try {
      const d = await this.col('full').doc(id).get();
      if (!d.exists) return null;
      const r = d.data();
      await DB.raw.put('full', r);
      return r;
    } catch {
      return null;
    }
  },
  track(p) {
    this.pend++;
    this.status = 'syncing';
    p.then(() => {
      this.pend--;
      this.settle();
    }, e => {
      this.pend = Math.max(0, this.pend - 1);
      this.fail(e);
    });
  },
  settle() {
    if (this.pend > 0) return;
    this.status = 'ok';
    this.msg = 'ซิงก์ล่าสุด ' + new Date().toLocaleTimeString('th-TH', {
      hour: '2-digit',
      minute: '2-digit'
    });
    uiRefresh();
  },
  fail(e) {
    console.error(e);
    this.status = 'error';
    this.msg = e && e.code === 'permission-denied' ? 'ไม่มีสิทธิ์เขียนข้อมูล ตรวจ Security Rules' : e && e.message || String(e);
    uiRefresh();
  }
};

/* ครอบ DB: ใส่ updatedAt + ส่งขึ้นคลาวด์ + บันทึกการลบ */
(() => {
  const raw = {
    put: DB.put.bind(DB),
    putMany: DB.putMany.bind(DB),
    del: DB.del.bind(DB)
  };
  DB.raw = raw;
  DB.put = async (s, o) => {
    const t = s !== 'settings';
    if (t) o.updatedAt = Date.now();
    await raw.put(s, o);
    if (t) Sync.push(s, [o]);
  };
  DB.putMany = async (s, a) => {
    const t = s !== 'settings';
    if (t) {
      const n = Date.now();
      a.forEach(o => o.updatedAt = n);
    }
    await raw.putMany(s, a);
    if (t) Sync.push(s, a);
  };
  DB.del = async (s, ids) => {
    ids = [].concat(ids);
    await raw.del(s, ids);
    if (s !== 'settings') Sync.remove(s, ids);
  };
})();
