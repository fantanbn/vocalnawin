<script>
'use strict';

const pad=n=>String(n).padStart(2,'0');

const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return fmt(d)};

const TH_SHORT=['จ','อ','พ','พฤ','ศ','ส','อา'];
const TH_MON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const fdate=s=>{const d=parse(s);return `${d.getDate()} ${TH_MON[d.getMonth()]}`};
const fdateY=s=>{const d=parse(s);return `${d.getDate()} ${TH_MON[d.getMonth()]} ${String(d.getFullYear()+543).slice(2)}`};

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

const EMOJIS=['🦌','🐰','🐻','🐼','🐱','🐶','🦊','🐸','🦄','🐧','🐥','🌈'];
const DAY_TARGETS={th:10,en:7};
const DAY_MAX=DAY_TARGETS.th+DAY_TARGETS.en;
const WEEK_TARGETS={th:DAY_TARGETS.th*5,en:DAY_TARGETS.en*5};

/* ====== Data sanitizers (v3.7): กรองข้อมูลจาก JSON นำเข้า / Firestore ก่อนใช้งาน ====== */
const SAFE_ID=/^[^\s"'<>&`\\\/]{1,100}$/;
const safeColor=c=>/^#[0-9a-fA-F]{3,8}$/.test(String(c||''))?String(c):COLORS[0];
const safeImg=u=>typeof u==='string'&&/^data:image\/(?:png|jpe?g|gif|webp);base64,[A-Za-z0-9+\/=]+$/.test(u)?u:'';
const okDate=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&fmt(parse(s))===s;
const clip=(v,n)=>String(v??'').slice(0,n);
const timeNum=v=>Number.isFinite(+v)&&+v>0?+v:Date.now();
const cleanList=(a,f)=>(Array.isArray(a)?a:[]).map(f).filter(Boolean);
function cleanStudent(x){
 if(!x||typeof x!=='object'||!SAFE_ID.test(String(x.id||''))||!String(x.name||'').trim())return null;
 return {...x,id:String(x.id),name:clip(x.name,60),level:clip(x.level,60),color:safeColor(x.color),emoji:[...String(x.emoji||'🦌')].slice(0,16).join(''),photo:safeImg(x.photo),createdAt:timeNum(x.createdAt)}}
function cleanWord(x){
 if(!x||typeof x!=='object'||!SAFE_ID.test(String(x.id||''))||!SAFE_ID.test(String(x.sid||''))||!okDate(x.date))return null;
 const text=clip(x.text,200).trim();if(!text)return null;
 const lang=x.lang==='th'||x.lang==='en'?x.lang:(/[\u0E00-\u0E7F]/.test(text)&&!/[A-Za-z]/.test(text)?'th':'en');
 return {...x,id:String(x.id),sid:String(x.sid),date:x.date,lang,text,meaning:clip(x.meaning,300),reading:clip(x.reading,300),hard:!!x.hard,source:clip(x.source||'manual',40),imageId:SAFE_ID.test(String(x.imageId||''))?String(x.imageId):'',createdAt:timeNum(x.createdAt)}}
function cleanDrill(x){
 if(!x||typeof x!=='object'||!SAFE_ID.test(String(x.id||''))||!SAFE_ID.test(String(x.sid||'')))return null;
 const ids=a=>(Array.isArray(a)?a:[]).map(String).filter(i=>SAFE_ID.test(i));
 const base={...x,id:String(x.id),sid:String(x.sid),createdAt:timeNum(x.createdAt)};
 if(Array.isArray(x.sets)){
  const days=(Array.isArray(x.days)?x.days:[]).filter(okDate).sort();
  if(!days.length)return null;
  return {...base,days,lang:x.lang==='th'?'th':x.lang==='en'?'en':'',perSet:Math.max(1,Math.min(50,Math.round(+x.perSet)||15)),poolSize:Math.max(0,+x.poolSize||0),skipped:Math.max(0,+x.skipped||0),sets:x.sets.map(s=>({wordIds:ids(s&&s.wordIds)})).filter(s=>s.wordIds.length)}}
 const d=okDate(x.date)?x.date:fmt(new Date(base.createdAt));
 return {...base,kind:x.kind==='hard'?'hard':'practice',date:d,from:okDate(x.from)?x.from:d,to:okDate(x.to)?x.to:d,wordIds:ids(x.wordIds)}}

/* ====== Database (IndexedDB, in-memory fallback) ====== */
const DB={db:null,mem:null,stores:['students','words','drills','images','full','settings'],
 async open(){
  try{
   this.db=await new Promise((res,rej)=>{const r=indexedDB.open('littlefawn-wordstudio',1);
    r.onupgradeneeded=()=>this.stores.forEach(n=>{if(!r.result.objectStoreNames.contains(n))r.result.createObjectStore(n,{keyPath:'id'})});
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'))});
  }catch(e){console.warn(e);this.db=null;this.mem={};this.stores.forEach(n=>this.mem[n]=new Map());setTimeout(()=>toast('⚠️ ใช้ฐานข้อมูลในเบราว์เซอร์ไม่ได้ ข้อมูลจะหายเมื่อปิดหน้า'),500)}
 },
 run(store,mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction(store,mode);const st=t.objectStore(store);let r;try{r=fn(st)}catch(e){rej(e);return}
  t.oncomplete=()=>res(r&&r.result!==undefined?r.result:undefined);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
 all(s){return this.db?this.run(s,'readonly',o=>o.getAll()).then(x=>x||[]):Promise.resolve([...this.mem[s].values()])},
 get(s,id){return this.db?this.run(s,'readonly',o=>o.get(id)):Promise.resolve(this.mem[s].get(id))},
 put(s,o){if(!this.db){this.mem[s].set(o.id,o);return Promise.resolve()}return this.run(s,'readwrite',st=>{st.put(o)})},
 putMany(s,a){if(!this.db){a.forEach(o=>this.mem[s].set(o.id,o));return Promise.resolve()}return this.run(s,'readwrite',st=>{a.forEach(o=>st.put(o))})},
 del(s,ids){ids=[].concat(ids);if(!this.db){ids.forEach(i=>this.mem[s].delete(i));return Promise.resolve()}return this.run(s,'readwrite',st=>{ids.forEach(i=>st.delete(i))})}
};

/* ====== Migration: Word Studio v1 (Local Storage) -> IndexedDB ======
   เปิด v3 ครั้งแรกในเบราว์เซอร์เดิม จะย้ายนักเรียน/คำศัพท์/รูป/ชุดฝึกจาก v1 ให้อัตโนมัติ (ครั้งเดียว ไม่ลบข้อมูลต้นฉบับ) */
async function migrateV1(){
 try{
  const raw=localStorage.getItem('Little_Fawn_WORD_STUDIO_V1');
  if(!raw)return 0;
  if(await DB.get('settings','migrated-v1'))return 0;
  const old=JSON.parse(raw);
  if(!old||!Array.isArray(old.students))return 0;
  const base=Date.now();
  const stuIds=new Set((await DB.all('students')).map(x=>x.id));
  const students=old.students.filter(x=>x&&x.id&&x.name&&!stuIds.has(x.id)).map((x,i)=>({id:x.id,name:String(x.name),level:[x.level,x.age].filter(Boolean).join(' • '),color:x.color||COLORS[i%COLORS.length],emoji:x.avatar||x.emoji||'🦌',photo:x.photo||'',createdAt:x.createdAt||base+i}));
  if(students.length)await DB.putMany('students',students);
  const validStu=new Set([...stuIds,...students.map(x=>x.id)]);
  const wordIds=new Set((await DB.all('words')).map(x=>x.id));
  const words=(Array.isArray(old.words)?old.words:[]).filter(w=>w&&w.id&&w.word&&w.date&&validStu.has(w.studentId)&&!wordIds.has(w.id))
   .map((w,i)=>({id:w.id,sid:w.studentId,date:w.date,lang:w.lang==='th'?'th':'en',text:String(w.word),meaning:w.meaning||'',reading:w.reading||'',hard:!!w.difficult,source:w.source||'manual',imageId:w.imageId||'',createdAt:w.createdAt||base+1000+i}));
  if(words.length)await DB.putMany('words',words);
  const imIds=new Set((await DB.all('images')).map(x=>x.id));
  for(const [id,data] of Object.entries(old.images||{})){
   if(typeof data!=='string'||!data.startsWith('data:image'))continue;
   if(!imIds.has(id))await DB.put('images',{id,thumb:data});
   if(!await DB.get('full',id))await DB.put('full',{id,data});
  }
  const allMap=new Map((await DB.all('words')).map(w=>[w.id,w]));
  const drillIds=new Set((await DB.all('drills')).map(x=>x.id));
  const drills=(Array.isArray(old.sets)?old.sets:[]).filter(d=>d&&d.id&&!drillIds.has(d.id)&&validStu.has(d.studentId)).map(d=>{
   const ids=(Array.isArray(d.items)?d.items:[]).map(x=>x&&x.wordId).filter(id=>allMap.has(id));
   const dates=ids.map(id=>allMap.get(id).date).sort(),cd=d.createdAt||base,cdISO=fmt(new Date(cd));
   return {id:d.id,sid:d.studentId,kind:d.type==='hard'?'hard':'practice',createdAt:cd,date:cdISO,from:dates[0]||cdISO,to:dates[dates.length-1]||cdISO,wordIds:ids,migratedFrom:'v1'};
  }).filter(d=>d.wordIds.length);
  if(drills.length)await DB.putMany('drills',drills);
  if(old.activeStudentId&&validStu.has(old.activeStudentId)&&!localStorage.getItem('lf_sid'))localStorage.setItem('lf_sid',old.activeStudentId);
  await DB.put('settings',{id:'migrated-v1',at:Date.now(),students:students.length,words:words.length,drills:drills.length});
  if(words.length||students.length)setTimeout(()=>toast(`🔄 อัปเดตเป็น v3: ย้ายข้อมูลเดิม ${words.length} คำให้เรียบร้อย`),700);
  return words.length;
 }catch(e){console.warn('v1 migration skipped',e);return 0}
}

const PROVIDERS={gemini:'Google Gemini',openai:'OpenAI',openrouter:'OpenRouter'};
function normalizeCfg(){
 const c=S.cfg;
 if(!PROVIDERS[c.provider])c.provider='gemini';
 if(!c.models)c.models={};
 c.keys={gemini:'',openai:'',openrouter:'',...(c.keys||{})};
 c.bases={openai:'',openrouter:'https://openrouter.ai/api/v1',...(c.bases||{})};
 if(c.key&&!c.keys[c.provider])c.keys[c.provider]=c.key;
 if(c.provider!=='gemini'&&c.base&&!c.bases[c.provider])c.bases[c.provider]=c.base;
 if(!c.bases.openrouter)c.bases.openrouter='https://openrouter.ai/api/v1';
 if(c.presetsVersion!==3){
  if(Array.isArray(c.models.gemini)){
   // เพิ่มโมเดลฟรีรุ่นใหม่ให้บัญชีเดิมโดยไม่ทับลำดับที่ผู้ใช้จัดเอง
   [['gemini-3-flash-preview',true],['gemini-3.1-flash-lite',true]].forEach(([id,on])=>{
    if(!c.models.gemini.some(m=>m.id===id))c.models.gemini.splice(1,0,{id,on});
   });
  }
  c.presetsVersion=3;
 }
 c.key=c.keys[c.provider]||'';
 c.base=c.provider==='gemini'?'':(c.bases[c.provider]||'');
 return c;
}

function dayCounts(sid,d,list){
 const L=list||dayWords(sid,d),th=L.filter(w=>w.lang==='th').length,en=L.filter(w=>w.lang==='en').length;
 const remainTh=Math.max(0,DAY_TARGETS.th-th),remainEn=Math.max(0,DAY_TARGETS.en-en);
 return {th,en,total:L.length,remainTh,remainEn,remain:remainTh+remainEn,complete:remainTh===0&&remainEn===0};
}

 return {days,th:sum('th'),en:sum('en'),total:sum('total'),remainTh:sum('remainTh'),remainEn:sum('remainEn'),remain:sum('remain')};
}

/* ====== Toast / modal / confirm ====== */
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),3200)}
const M=[];
function openModal(render,o={}){
 const el=document.createElement('div');el.className='overlay';
 const dlg=document.createElement('div');dlg.className='dialog '+(o.cls||'');dlg.innerHTML=render();el.appendChild(dlg);
 const m={el,dlg,render,live:!!o.live,res:null};
 el.addEventListener('mousedown',e=>{if(e.target===el&&o.bd)closeModal(m)});
 m.prev=document.activeElement;dlg.setAttribute('role','dialog');dlg.setAttribute('aria-modal','true');dlg.tabIndex=-1;$('#modals').appendChild(el);M.push(m);document.body.classList.add('noscroll');if(!dlg.contains(document.activeElement))dlg.focus({preventScroll:true});return m}
function closeModal(m){const i=M.indexOf(m);if(i<0)return;M.splice(i,1);m.el.remove();if(m.res)m.res(false);if(!M.length)document.body.classList.remove('noscroll');try{if(m.prev&&m.prev!==document.body&&document.contains(m.prev))m.prev.focus({preventScroll:true})}catch{}}
const modalOf=el=>M.find(m=>m.el.contains(el));
function ask(title,msg,ok='ลบเลย'){return new Promise(res=>{const m=openModal(()=>`<h3>${esc(title)}</h3><p>${msg}</p><div class="row end"><button class="btn" data-act="ask-no">ยกเลิก</button><button class="btn danger" data-act="ask-yes">${esc(ok)}</button></div>`,{cls:'small',bd:true});m.res=res})}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&M.length)closeModal(M[M.length-1])});
function shakeEls(els){els.forEach(e=>{e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake');setTimeout(()=>e.classList.remove('shake'),900)})}
const shakeWord=id=>shakeEls($$(`[data-wid="${id}"]`));

/* --- Drills: เลือกวัน → สุ่มคำยากระดับ ป.3 → แบ่งเป็นชุด --- */
/* คะแนนความยากโดยประมาณ (ไม่ใช้ดาว) — ยิ่งสูงยิ่งยากสำหรับเด็ก ป.3 */
function hardScore(w){
 const t=String(w.text||'').trim();let s=0;
 const isTh=w.lang==='th'||(/[\u0E00-\u0E7F]/.test(t)&&!/[A-Za-z]/.test(t));
 if(isTh){
  const n=[...t].filter(c=>/[\u0E01-\u0E4E]/.test(c)).length;
  s+=n>=8?3:n>=6?2:n>=4?1:0;
  if(/\u0E4C/.test(t))s+=1.5;
  if(/[ศษฬฑฒณธฌฎฏฐฆฅฃฝฤฦ]/.test(t))s+=1;
  if(/[กขคตปพผ][รลว]/.test(t))s+=1;
  const syl=w.reading?String(w.reading).split(/[-\s]+/).filter(Boolean).length:0;
  s+=syl>=4?1:syl>=3?.5:0;
 }else{
  const lower=t.toLowerCase(),n=lower.replace(/[^a-z]/g,'').length;
  s+=n>=10?3:n>=8?2.5:n>=6?1.5:n>=5?.5:0;
  if(/\s/.test(t))s+=1;
  let g=(lower.match(/[aeiouy]+/g)||[]).length;
  if(/[^aeiouy]e$/.test(lower)&&!/le$/.test(lower)&&g>1)g--;
  s+=g>=4?2:g>=3?1:0;
  const pats=[/ough/,/augh/,/eigh/,/tion/,/sion/,/cious/,/tious/,/ture/,/ph/,/gh/,/^kn/,/^wr/,/mb$/,/^ps/,/sch/,/ei/,/ie/];
  s+=Math.min(1.5,pats.filter(r=>r.test(lower)).length*.75);
 }
 return s}
function weightedPick(arr,wf){
 const ws=arr.map(wf),tot=ws.reduce((a,b)=>a+b,0);let r=Math.random()*tot;
 for(let i=0;i<arr.length;i++){r-=ws[i];if(r<=0)return arr[i]}
 return arr[arr.length-1]}
async function aiDifficulty(words,score){
 const out=new Map();
 const list=words.map((w,n)=>({n,lang:w.lang,word:w.text,s:score.get(w.id)||0})).sort((a,b)=>b.s-a.s).slice(0,300).map(({n,lang,word})=>({n,lang,word}));
 for(let i=0;i<list.length;i+=100){
  const chunk=list.slice(i,i+100);
  const p=`Rate how difficult each vocabulary word is for a Thai Grade 3 (ป.3, about 9 years old) student, from 1 (very easy) to 5 (very hard). English words: consider spelling, length, and whether it is beyond typical primary-school vocabulary. Thai words: consider spelling difficulty, silent letters (การันต์), consonant clusters, rare consonants and word length. Input: ${JSON.stringify(chunk)}. Return ONLY JSON {"items":[{"n":0,"level":3}]}`;
  const r=await llm(p);
  (Array.isArray(r)?r:r.items||[]).forEach(x=>{const w=words[x.n],lv=+x.level;if(w&&lv>=1&&lv<=5)out.set(w.id,lv)})}
 return out}
async function buildDrill(sid,days,o){
 const per=o.per,nSets=o.sets,total=per*nSets;
 const lang=o.lang==='th'?'th':'en', wordsFor=d=>dayWords(sid,d).filter(w=>w.lang===lang);
 let ds=[...new Set(days)].sort().filter(d=>wordsFor(d).length);
 if(!ds.length)return null;
 let skipped=0;const maxDays=Math.max(1,Math.floor(total/2));
 if(ds.length>maxDays){skipped=ds.length-maxDays;ds=shuffle(ds).slice(0,maxDays).sort()}
 const all=ds.flatMap(d=>wordsFor(d));
 const score=new Map(all.map(w=>[w.id,hardScore(w)]));
 let usedAI=false;
 if(SHOW_API_UI&&o.ai&&S.cfg.key){try{const r=await aiDifficulty(all,score);r.forEach((lv,id)=>score.set(id,lv*1.6));usedAI=r.size>0}catch(e){console.warn(e);toast('AI ประเมินไม่ได้ ใช้เกณฑ์ในเครื่องแทน')}}
 const weight=w=>Math.pow(1.6,score.get(w.id)||0)*(o.star&&w.hard?3:1);
 const rem=new Map(ds.map(d=>[d,shuffle(wordsFor(d))])),cnt=new Map(ds.map(d=>[d,0])),picked=[];
 /* วนเลือกทีละวัน วันที่ถูกเลือกน้อยสุดก่อน → ทุกวันได้อย่างน้อย 2 คำ (ถ้ามีคำพอ) */
 while(picked.length<total){
  const cands=ds.filter(d=>rem.get(d).length);if(!cands.length)break;
  const mn=Math.min(...cands.map(d=>cnt.get(d))),tie=cands.filter(d=>cnt.get(d)===mn);
  const d=tie[Math.floor(Math.random()*tie.length)],w=weightedPick(rem.get(d),weight);
  picked.push(w);cnt.set(d,cnt.get(d)+1);
  const k=norm(w.text);rem.forEach((a,key)=>rem.set(key,a.filter(x=>norm(x.text)!==k)))}
 /* แจกเข้าชุด ให้แต่ละชุดมีคำจากหลายวัน */
 const sets=Array.from({length:nSets},()=>({ids:[],days:new Set()}));
 picked.forEach(w=>{
  const open=sets.filter(x=>x.ids.length<per);if(!open.length)return;
  const fresh=open.filter(x=>!x.days.has(w.date)),c=fresh.length?fresh:open;
  const mn=Math.min(...c.map(x=>x.ids.length)),t=c.filter(x=>x.ids.length===mn),x=t[Math.floor(Math.random()*t.length)];
  x.ids.push(w.id);x.days.add(w.date)});
 return {id:uid(),sid,kind:'mix',lang,createdAt:Date.now(),days:ds,perSet:per,star:!!o.star,ai:usedAI,poolSize:all.length,skipped,
  sets:sets.filter(x=>x.ids.length).map(x=>({wordIds:shuffle(x.ids)}))}}
function drillDefaults(){
 if(ui.drInit||!S.words.length)return;ui.drInit=true;
 const lw=addDays(weekStart(today()),-7);
 ui.drDays=[0,1,2,3,4,5,6].map(i=>addDays(lw,i)).filter(d=>S.words.some(w=>w.sid===ui.sid&&w.date===d))}
const drillCount=d=>d.sets?d.sets.reduce((a,x)=>a+x.wordIds.length,0):(d.wordIds||[]).length;
const drillWords=(sid,d)=>dayWords(sid,d).filter(w=>w.lang===ui.drLang);
function viewDrill(){

 const sel=new Set(ui.drDays),cw=weekStart(today());
 const weeks=[['สัปดาห์ที่แล้ว',addDays(cw,-7)],['สัปดาห์นี้',cw]];
 const inWeeks=new Set(weeks.flatMap(([,ws])=>[0,1,2,3,4,5,6].map(i=>addDays(ws,i))));
 const chip=d=>{const n=drillWords(s.id,d).length;return `<button class="btn small dchip ${sel.has(d)?'on':''} ${n?'':'zero'}" data-act="dr-day" data-date="${d}">${sel.has(d)?'✓ ':''}${TH_SHORT[dow(d)]} ${fdate(d)} (${n})</button>`};
 const wkHTML=weeks.map(([lab,ws])=>{
  const ds=[0,1,2,3,4,5,6].map(i=>addDays(ws,i)),withW=ds.filter(d=>drillWords(s.id,d).length),all=withW.length&&withW.every(d=>sel.has(d));
  return `<div class="dweek"><div class="row"><b>${lab}</b><small>${fdate(ws)}–${fdate(addDays(ws,6))}</small><button class="btn small ${all?'on':''}" data-act="dr-week" data-ws="${ws}">${all?'✓ ':''}เลือกทั้งสัปดาห์</button></div><div class="daystrip">${ds.map(chip).join('')}</div></div>`}).join('');
 const extra=[...sel].filter(d=>!inWeeks.has(d)).sort();
 const withW=[...sel].filter(d=>drillWords(s.id,d).length),poolN=withW.reduce((a,d)=>a+drillWords(s.id,d).length,0),total=ui.drPer*ui.drSets;
 const warns=[];

function loadImage(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error('เปิดรูปไม่ได้'));im.src=fr.result};fr.onerror=()=>rej(new Error('อ่านไฟล์ไม่ได้'));fr.readAsDataURL(file)})}
function scale(im,max,q){const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}

function parseJSON(t){t=String(t).replace(/^\s*```(?:json)?/i,'').replace(/```\s*$/,'').trim();try{return JSON.parse(t)}catch{const m=t.match(/[\[{][\s\S]*[\]}]/);if(m)return JSON.parse(m[0]);throw new Error('ผลลัพธ์ไม่ใช่ JSON')}}

function classifyErr(e){
 if(e.parse)return{kind:'bad',ms:0};
 if(!e.status)return{kind:'fatal'};
 const raw=JSON.stringify(e.body||{}),msg=String(e.message||'');
 if(/insufficient_quota/i.test(raw))return{kind:'billing'};
 if(e.status===429||/resource_exhausted|quota|rate.?limit/i.test(raw+msg))return{kind:'quota',ms:/perday|per day|daily/i.test(raw+msg)?6*36e5:90e3};
 if(e.status===404)return{kind:'gone',ms:24*36e5};
 if([500,502,503,504].includes(e.status)||/overloaded|unavailable/i.test(msg))return{kind:'busy',ms:30e3};
 return{kind:'fatal'}}
async function callModel(model,prompt,img){
 normalizeCfg();const {provider,key,base}=S.cfg;let r;
 if(provider==='gemini'){
  const parts=[{text:prompt}];if(img){const[h,b]=img.split(',');parts.push({inline_data:{mime_type:h.match(/:(.*?);/)[1],data:b}})}
  r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({contents:[{role:'user',parts}],generationConfig:{temperature:.1,responseMimeType:'application/json'}})});
 }else{
  const content=[{type:'text',text:prompt}];if(img)content.push({type:'image_url',image_url:{url:img}});
  const endpointBase=(base||(provider==='openrouter'?'https://openrouter.ai/api/v1':'https://api.openai.com/v1')).replace(/\/$/,'');
  r=await fetch(endpointBase+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+key,...(provider==='openrouter'?{'X-Title':'Little Fawn Word Studio'}:{})},body:JSON.stringify({model,temperature:.1,response_format:{type:'json_object'},messages:[{role:'user',content}]})});
 }
 const j=await r.json().catch(()=>({}));
 if(!r.ok){const e=new Error(j.error?.message||('HTTP '+r.status));e.status=r.status;e.body=j;throw e}
 const mc=j.choices?.[0]?.message?.content||'';const txt=provider==='gemini'?(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join(''):(Array.isArray(mc)?mc.map(x=>x.text||x.content||'').join(''):mc);
 try{return parseJSON(txt)}catch(er){er.parse=true;throw er}}
async function llm(prompt,img){

 const c=S.cfg;if(!c.key)throw new Error('ยังไม่ได้ตั้งค่า API key');
 const all=mlist().filter(m=>m.on).map(m=>m.id);
 if(!all.length)throw new Error('ยังไม่ได้เปิดโมเดลสักตัว (เปิดในหน้าตั้งค่า)');
 const now=Date.now();let order=all.filter(m=>!(cool[ckey(m)]>now));
 if(!order.length)order=[all.slice().sort((a,b)=>(cool[ckey(a)]||0)-(cool[ckey(b)]||0))[0]];
 let last=null,said=false,quotaSeen=false;
 for(let i=0;i<order.length;i++){
  const m=order[i];
  try{
   const r=await callModel(m,prompt,img);
   if(S.lastModel&&S.lastModel!==m&&!said)toast(`🔀 สลับโมเดล: ${S.lastModel} → ${m}`);
   S.lastModel=m;return r;
  }catch(e){

    if(t!==undefined&&t>=(r.updatedAt||0)){await DB.raw.del(n,r.id);continue}
    if(!r.updatedAt){r.updatedAt=Date.now();await DB.raw.put(n,r)}
    const ru=this.remote[n].get(r.id);
    if(ru===undefined||r.updatedAt>ru)out.push(r)}
   if(out.length)this.track(this.pushDocs(n,out));
   if(n==='images'&&out.length){const fl=[];for(const r of out){const f=await DB.get('full',r.id);if(f)fl.push(f)}if(fl.length)this.track(this.pushDocs('full',fl))}}
  await reloadState();this.settle();uiRefresh()},
 async pushDocs(n,list){
  for(let i=0;i<list.length;i+=10){
   await Promise.all(list.slice(i,i+10).map(r=>{
    if(n==='full'&&(r.data||'').length>900000){console.warn('รูปใหญ่เกิน 1MB ไม่ซิงก์',r.id);return}
    return this.col(n).doc(r.id).set(r)}))}},
 push(n,list){if(!this.live||!this.user||!this.ALL.includes(n))return;this.track(this.pushDocs(n,list))},
 remove(n,ids){
  if(!this.ALL.includes(n))return;const at=Date.now();ids.forEach(id=>{this.tombs[n+'/'+id]=at});this.saveTombs();
  if(!this.live||!this.user)return;
  this.track(Promise.all(ids.flatMap(id=>[this.col(n).doc(id).delete(),this.col('tombs').doc(n+'__'+id).set({s:n,id,at})])))},
 async fetchFull(id){
  if(!this.user)return null;
  try{const d=await this.col('full').doc(id).get();if(!d.exists)return null;const r=d.data();await DB.raw.put('full',r);return r}catch{return null}},
 track(p){this.pend++;this.status='syncing';p.then(()=>{this.pend--;this.settle()},e=>{this.pend=Math.max(0,this.pend-1);this.fail(e)})},
 settle(){if(this.pend>0)return;this.status='ok';this.msg='ซิงก์ล่าสุด '+new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});uiRefresh()},
 fail(e){console.error(e);this.status='error';this.msg=e&&e.code==='permission-denied'?'ไม่มีสิทธิ์เขียนข้อมูล ตรวจ Security Rules':(e&&e.message)||String(e);uiRefresh()}
};

/* ครอบ DB: ใส่ updatedAt + ส่งขึ้นคลาวด์ + บันทึกการลบ */
(()=>{const raw={put:DB.put.bind(DB),putMany:DB.putMany.bind(DB),del:DB.del.bind(DB)};DB.raw=raw;
 DB.put=async(s,o)=>{const t=s!=='settings';if(t)o.updatedAt=Date.now();await raw.put(s,o);if(t)Sync.push(s,[o])};
 DB.putMany=async(s,a)=>{const t=s!=='settings';if(t){const n=Date.now();a.forEach(o=>o.updatedAt=n)}await raw.putMany(s,a);if(t)Sync.push(s,a)};
 DB.del=async(s,ids)=>{ids=[].concat(ids);await raw.del(s,ids);if(s!=='settings')Sync.remove(s,ids)};
})();

/* หน้าตั้งค่าซิงก์ */
function syncHTML(){
 const head='<section class="sec"><h2>☁️ ซิงก์ข้อมูลข้ามเครื่อง <small>Firebase</small></h2><div class="rcard crayon">';
 if(!Sync.enabled)return head+`<div class="note">${FIREBASE_CONFIG.apiKey?esc(Sync.msg||'เริ่ม Firebase ไม่สำเร็จ'):'ยังไม่ได้ตั้งค่า Firebase — ใส่ค่า FIREBASE_CONFIG ในไฟล์ HTML'}</div></div></section>`;
 if(!Sync.user)return head+`<p>ล็อกอินบัญชีเดียวกันทุกเครื่อง ข้อมูลจะตรงกัน</p>
  <label class="f">อีเมล<input class="inp" id="sy-email" type="email" autocomplete="username"></label>
  <label class="f">รหัสผ่าน (อย่างน้อย 6 ตัว)<input class="inp" id="sy-pw" type="password" autocomplete="current-password"></label>
  <div class="row"><button class="btn orange" data-act="sync-in">เข้าสู่ระบบ</button>${ALLOW_SIGNUP?'<button class="btn mint" data-act="sync-up">สร้างบัญชีใหม่ (ครั้งแรก)</button>':''}<button class="btn small" data-act="sync-reset">ลืมรหัสผ่าน</button></div></div></section>`;
 const lab={ok:'✅ ซิงก์แล้ว',syncing:'⏳ กำลังซิงก์…',error:'⚠️ มีปัญหา'}[Sync.status]||'';
 return head+`<p>บัญชี: <b>${esc(Sync.user.email)}</b></p><p>${lab} ${esc(Sync.msg)}</p>
  <div class="row"><button class="btn sky" data-act="sync-now">🔄 ซิงก์ใหม่</button><button class="btn" data-act="sync-out">ออกจากระบบ</button></div></div></section>`}
function authMsg(e){const m={'auth/invalid-credential':'อีเมลหรือรหัสผ่านไม่ถูกต้อง','auth/wrong-password':'รหัสผ่านไม่ถูกต้อง','auth/user-not-found':'ไม่พบบัญชีนี้'+(ALLOW_SIGNUP?' (กด “สร้างบัญชีใหม่” ถ้าเป็นครั้งแรก)':''),'auth/email-already-in-use':'อีเมลนี้มีบัญชีแล้ว ให้กด “เข้าสู่ระบบ”','auth/weak-password':'รหัสผ่านสั้นเกินไป','auth/invalid-email':'รูปแบบอีเมลไม่ถูกต้อง','auth/operation-not-allowed':'ยังไม่ได้เปิด Email/Password ใน Firebase','auth/network-request-failed':'ไม่มีอินเทอร์เน็ต','auth/unauthorized-domain':'โดเมนนี้ยังไม่ได้เพิ่มใน Authorized domains'};return m[e.code]||e.message}
async function syncAuth(el,fn){const box=el.closest('.rcard'),e=$('#sy-email',box).value.trim(),p=$('#sy-pw',box).value;
 if(!e||p.length<6)return toast('กรอกอีเมลและรหัสผ่าน (อย่างน้อย 6 ตัว)');
 try{await Sync[fn](e,p);toast('☁️ เข้าสู่ระบบแล้ว')}catch(err){toast('❌ '+authMsg(err))}}
A['sync-in']=el=>syncAuth(el,'signIn');A['sync-up']=el=>ALLOW_SIGNUP?syncAuth(el,'signUp'):toast('ปิดการสมัครบัญชีใหม่ไว้แล้ว');
A['sync-reset']=async el=>{const e=$('#sy-email',el.closest('.rcard')).value.trim();if(!e)return toast('กรอกอีเมลก่อน แล้วกด “ลืมรหัสผ่าน”');
 try{await Sync.auth.sendPasswordResetEmail(e);toast('ส่งอีเมลรีเซ็ตรหัสผ่านแล้ว (เช็กกล่องสแปมด้วย)')}catch(err){toast('❌ '+authMsg(err))}};
A['sync-now']=()=>{Sync.stop();Sync.start()};
A['sync-out']=async()=>{if(!await ask('ออกจากระบบซิงก์?','ข้อมูลในเครื่องนี้ยังอยู่ แต่จะไม่ซิงก์จนกว่าจะเข้าสู่ระบบใหม่','ออกจากระบบ'))return;await Sync.signOut()};

/* ====== Accessibility helpers (v3.7) ====== */
document.addEventListener('keydown',e=>{
 const t=e.target;
 if((e.key==='Enter'||e.key===' ')&&t.matches&&t.matches('[role="button"][data-act]')){e.preventDefault();t.click();return}
 if(e.key==='Tab'&&M.length){ /* ล็อกโฟกัสไว้ในหน้าต่างที่เปิดอยู่ */
  const d=M[M.length-1].dlg,f=$$('a[href],button:not([disabled]),input:not([disabled]):not([type=hidden]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])',d).filter(x=>x.offsetParent!==null);
  if(!f.length){e.preventDefault();d.focus();return}
  const a=f[0],z=f[f.length-1],cur=document.activeElement;
  if(e.shiftKey&&(cur===a||cur===d)){e.preventDefault();z.focus()}
  else if(!e.shiftKey&&cur===z){e.preventDefault();a.focus()}}});
const _lab=()=>$$('button[title]:not([aria-label]),[role="button"][title]:not([aria-label])').forEach(b=>b.setAttribute('aria-label',b.getAttribute('title')));
new MutationObserver(()=>{clearTimeout(_lab.t);_lab.t=setTimeout(_lab,50)}).observe(document.body,{childList:true,subtree:true});
